document.getElementById("btn-wait").addEventListener("pointerdown", e=>{ e.preventDefault(); SFX.unlock(); waitTurn(); });
document.getElementById("btn-potion").addEventListener("pointerdown", e=>{ e.preventDefault(); SFX.unlock(); usePotion(); });
document.getElementById("btn-pause").addEventListener("pointerdown", e=>{ e.preventDefault(); SFX.unlock(); if(mode==="title"||mode==="dead") startGame(); else togglePause(); });
document.getElementById("btn-mute").addEventListener("click", e=>{ e.preventDefault(); SFX.unlock(); toggleMute(); });

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=clamp(now-last,0,50);
  last=now;
  time+=dt/1000;
  if(mode==="play"||mode==="pause"||mode==="dead"){
    if(mode==="play") tickAnim(dt);
    for(const m of msgs) m.t+=dt;
    while(msgs.length&&msgs[0].t>7000) msgs.shift();
  }
  try{ render(dt); }catch(err){ _errors.push(String(err&&err.stack||err)); console.error(err); }
  requestAnimationFrame(frame);
}

function boot(){
  try{
    buildProceduralTextures();
    buildProceduralSprites();
    resetMaps();
    let booted=false;
    const startLoop=()=>{ if(booted) return; booted=true; resize(); mode="title"; requestAnimationFrame(frame); };
    loadEmbeddedArt().then(used=>{
      artUsed=used||[];
      if(window.__AD) window.__AD.artUsed=artUsed;
      startLoop();
    }).catch(e=>{ _errors.push("art: "+e); startLoop(); });
    setTimeout(startLoop, 2500);
  }catch(err){
    _errors.push("boot: "+(err&&err.stack||err));
    console.error(err);
    ctx.fillStyle="#000"; ctx.fillRect(0,0,canvas.width||800,canvas.height||600);
    ctx.fillStyle="#f44"; ctx.font="16px monospace";
    ctx.fillText("Boot error: "+err,20,40);
  }
}

window.addEventListener("resize", resize);
if(window.visualViewport) window.visualViewport.addEventListener("resize", resize);

window.__AD={
  get mode(){ return mode; },
  get errors(){ return _errors.slice(); },
  get player(){ return player; },
  get floor(){ return floorNum; },
  get monsters(){ return monsters; },
  get stairs(){ return stairs; },
  get currentBoss(){ return currentBoss; },
  get artUsed(){ return artUsed; },
  set artUsed(v){ artUsed=v; },
  startGame,
  tryForward, tryBack, tryTurn, tryStrafe, tryAttack, usePotion, waitTurn, togglePause,
  generateFloor, MAP_W, MAP_H,
  get tiles(){ return tiles; },
  get explored(){ return explored; },
  get rooms(){ return rooms; },
  get items(){ return items; },
  get chests(){ return chests; },
  get startPos(){ return startPos; },
  get cam(){ return {x:camX,y:camY,a:camA,facing:player&&player.facing}; },
  goFloor(n){ floorNum=n-1; descend(); },
  killPlayer(){ player.hp=0; onPlayerDeath(); },
  faceBoss(){
    const b=currentBoss||monsters.find(m=>m.isBoss);
    if(!b) return false;
    // stand 2 tiles away, facing the boss, on a walkable tile
    const tries=[[0,2,3],[0,-2,1],[2,0,2],[-2,0,0],[0,1,3],[0,-1,1],[1,0,2],[-1,0,0]];
    for(const [dx,dy,f] of tries){
      const x=b.x+dx, y=b.y+dy;
      if(isFloorish(x,y)&&!monAt(x,y)&&tiles[y][x]!==T_PILLAR){
        player.x=x; player.y=y; player.facing=f;
        snapCam();
        b.seen=true;
        // explore the room
        for(const r of rooms){
          if(r.boss|| (x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)){
            for(let yy=r.y-1;yy<=r.y+r.h;yy++) for(let xx=r.x-1;xx<=r.x+r.w;xx++) if(inB(xx,yy)) explored[yy][xx]=true;
          }
        }
        markExploredAround();
        return true;
      }
    }
    return false;
  },
  revealAll(){ for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++) explored[y][x]=true; },
  clearBanner(){ banner=null; },
  faceNear(kind){
    // kind: "mon"|"chest"|"item"|null (any). Place player 2 tiles away facing it if possible.
    let targets=[];
    if(!kind||kind==="mon") for(const m of monsters) if(m.alive&&!m.isBoss) targets.push({x:m.x,y:m.y,pri:3});
    if(!kind||kind==="chest") for(const c of chests) if(!c.open) targets.push({x:c.x,y:c.y,pri:2});
    if(!kind||kind==="item") for(const it of items) targets.push({x:it.x,y:it.y,pri:1});
    if(!targets.length) return false;
    targets.sort((a,b)=>{
      const da=Math.abs(a.x-player.x)+Math.abs(a.y-player.y);
      const db=Math.abs(b.x-player.x)+Math.abs(b.y-player.y);
      return (da-db)||(b.pri-a.pri);
    });
    const t=targets[0];
    const tries=[[0,2,3],[0,-2,1],[2,0,2],[-2,0,0],[0,1,3],[0,-1,1],[1,0,2],[-1,0,0]];
    for(const [dx,dy,f] of tries){
      const x=t.x+dx, y=t.y+dy;
      if(isFloorish(x,y)&&!monAt(x,y)&&tiles[y][x]!==T_PILLAR){
        player.x=x; player.y=y; player.facing=f; snapCam();
        markExploredAround();
        return {x,y,facing:f,tx:t.x,ty:t.y};
      }
    }
    return false;
  }
};

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
