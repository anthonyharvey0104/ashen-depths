<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#07060c;position:fixed;inset:0;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{display:block;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 2px #1a1628,0 8px 40px rgba(0,0,0,.6)}
#btn-mute{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:30;width:44px;height:44px;border-radius:22px;background:rgba(18,16,32,.85);border:2px solid #6a6288;color:#e8e0b0;font-size:18px;font-family:monospace}
#btn-mute:active{border-color:#e0c060}
#touch-ui{position:fixed;left:0;right:0;bottom:0;padding:6px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:20}
#touch-ui.hidden{display:none}
#move-pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:6px;pointer-events:none}
#move-pad button,#actions button{pointer-events:auto;background:rgba(18,16,32,.86);border:2px solid #6a6288;color:#d8d0e8;font-family:monospace;font-weight:700;text-shadow:0 1px 0 #000;border-radius:10px}
#move-pad button{width:52px;height:52px;font-size:16px}
#move-pad button:active,#move-pad button.pressed,#actions button:active,#actions button.pressed{background:rgba(90,70,140,.95);border-color:#e0c060;color:#ffe890}
#actions{display:grid;grid-template-columns:76px 76px;grid-template-rows:52px 52px;gap:6px;pointer-events:none}
#actions button{width:76px;height:52px;font-size:11px;letter-spacing:1px;border-radius:12px}
#btn-atk{border-color:#c07040;color:#ffd090;font-size:12px;letter-spacing:1px;background:rgba(48,20,16,.9)}
#btn-atk:active,#btn-atk.pressed{border-color:#ffe080;color:#fff0c0;background:rgba(120,50,30,.95)}
#btn-potion{border-color:#c07090;color:#f0b0c0}
#btn-wait{border-color:#6090c0;color:#b0d0f0}
</style>

<div id="wrap"><canvas id="game"></canvas></div>

    <button id="d-tl" aria-label="Turn left">↺</button>
    <button id="d-fwd" aria-label="Forward">▲</button>
    <button id="d-tr" aria-label="Turn right">↻</button>

    <button id="d-back" aria-label="Back">▼</button>
    <button id="d-sr" aria-label="Strafe right">▶</button>

    <button id="btn-potion">POTION</button>

    <button id="btn-pause">PAUSE</button>
  </div>

const MAP_W=50, MAP_H=38;
const T_WALL=1, T_FLOOR=0, T_STAIRS=2, T_BOSS=4, T_RUG=5, T_PILLAR=6;
const TEX=128;
const DIR=[{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}]; // E S W N
const DNAME=["E","S","W","N"];

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});
ctx.imageSmoothingEnabled=false;

let VW=400, VH=240;          // 3D buffer
let SCALE=3, DPR=1, CSSW=0, CSSH=0, SHOW_TOUCH=false;
let viewX=0, viewY=0, viewW=0, viewH=0; // 3D viewport in canvas pixels (device)
const bufCan=document.createElement("canvas");
bufCan.width=VW; bufCan.height=VH;
const buf=bufCan.getContext("2d",{alpha:false});
let imgData=buf.createImageData(VW,VH);
let pix=new Uint32Array(imgData.data.buffer);
const zbuf=new Float32Array(VW);
const LE=(function(){const a=new Uint8Array(new Uint32Array([0x01020304]).buffer);return a[0]===4;})();
function PX(r,g,b,a){r=r|0;g=g|0;b=b|0;a=a==null?255:a|0;if(r<0)r=0;else if(r>255)r=255;if(g<0)g=0;else if(g>255)g=255;if(b<0)b=0;else if(b>255)b=255;return LE?((a<<24)|(b<<16)|(g<<8)|r)>>>0:((r<<24)|(g<<16)|(b<<8)|a)>>>0;}

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(t)=>t*t*(3-2*t);
const rand=(n)=>Math.floor(Math.random()*n);
const randi=(a,b)=>a+rand(b-a+1);
const choice=(a)=>a[rand(a.length)];
const dist=(ax,ay,bx,by)=>Math.abs(ax-bx)+Math.abs(ay-by);
const edist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const inB=(x,y)=>x>=0&&y>=0&&x<MAP_W&&y<MAP_H;
const key=(x,y)=>x+","+y;
const hex=(n)=>{n=n|0;return n<0?0:n>255?255:n;};
function hash2(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function hash3(x,y,z){let n=Math.sin(x*127.1+y*311.7+z*74.13)*43758.5453;return n-Math.floor(n);}

const _errors=[];

/* ---------- audio (same family as the top-down game) ---------- */
const SFX={
  ctx:null, muted:false, unlocked:false,
  unlock(){
    if(this.unlocked) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      this.ctx=new AC();
      const b=this.ctx.createBuffer(1,1,22050);
      const s=this.ctx.createBufferSource();
      s.buffer=b; s.connect(this.ctx.destination); s.start(0);
      this.ctx.resume(); this.unlocked=true;
    }catch(e){}
  },
  osc(freq,type,dur,vol,slide,delay){
    if(this.muted||!this.ctx) return;
    const t=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    o.type=type||"square";
    o.frequency.setValueAtTime(freq,t);
    if(slide!=null) o.frequency.linearRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(Math.max(0.0001,vol),t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol,bpFreq,delay,q){
    if(this.muted||!this.ctx) return;
    const t=this.ctx.currentTime+(delay||0);
    const len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=this.ctx.createBufferSource(); s.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type="bandpass";
    f.frequency.value=bpFreq||800; f.Q.value=q||1.2;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.ctx.destination);
    s.start(t); s.stop(t+dur+0.02);
  },
  step(){ this.noise(0.04,0.08,350); this.osc(80,"sine",0.05,0.04); },
  bump(){ this.osc(70,"square",0.07,0.06,50); this.noise(0.05,0.05,200); },
  swing(){ this.noise(0.08,0.12,1100,0,0.6); this.osc(240,"sawtooth",0.09,0.05,80); },
  hit(){ this.osc(190,"square",0.1,0.1,80); this.osc(320,"square",0.06,0.05); this.noise(0.06,0.08,600); },
  crit(){ this.osc(520,"square",0.08,0.09); this.osc(780,"square",0.1,0.07,0,0.04); this.osc(1040,"triangle",0.14,0.05,0,0.08); },
  hurt(){ this.osc(160,"sawtooth",0.16,0.12,70); this.osc(220,"square",0.1,0.07,90); this.noise(0.1,0.1,300); },
  die(){ this.osc(280,"square",0.25,0.1,60); this.osc(180,"triangle",0.3,0.07,40,0.05); },
  pickup(){ this.osc(660,"square",0.07,0.07); this.osc(880,"square",0.09,0.06,0,0.06); this.osc(1320,"triangle",0.1,0.04,0,0.1); },
  gold(){ this.osc(784,"square",0.06,0.06); this.osc(988,"square",0.08,0.05,0,0.05); },
  potion(){ this.osc(392,"sine",0.1,0.07); this.osc(523,"sine",0.12,0.07,0,0.07); this.osc(659,"sine",0.16,0.06,0,0.14); },
  stairs(){ [220,277,330,440,554].forEach((f,i)=>this.osc(f,"sine",0.22,0.07,f*1.5,i*0.07)); },
  boss(){ this.osc(55,"sawtooth",0.5,0.1); this.osc(82,"sawtooth",0.5,0.07,0,0.02); this.osc(110,"triangle",0.6,0.06,0,0.04); },
  levelup(){ [523,659,784,1046,1318].forEach((f,i)=>this.osc(f,"square",0.16,0.07,0,i*0.08)); },
  gameover(){ [392,349,311,247,196,165].forEach((f,i)=>this.osc(f,"triangle",0.28,0.09,f*0.8,i*0.14)); },
  ui(){ this.osc(880,"square",0.04,0.05); },
  magic(){ this.osc(480,"sine",0.18,0.08,960); this.osc(720,"triangle",0.2,0.05,1400,0.04); this.noise(0.12,0.06,2000,0,2); },
  freeze(){ this.osc(980,"sine",0.14,0.07); this.osc(1460,"sine",0.16,0.05,0,0.05); },
  charge(){ this.osc(80,"sawtooth",0.28,0.08,280); this.noise(0.25,0.08,400); },
  drain(){ this.osc(140,"sawtooth",0.22,0.08,60); this.osc(300,"sine",0.2,0.05,100); },
  seal(){ this.osc(180,"triangle",0.2,0.07,90); this.osc(90,"sine",0.25,0.05,0,0.05); },
  open(){ this.osc(200,"square",0.08,0.06,140); this.osc(320,"square",0.1,0.05,0,0.06); this.noise(0.08,0.05,500); },
  fire(){ this.noise(0.16,0.1,400,0,0.7); this.osc(180,"sawtooth",0.14,0.06,70); },
  turn(){ this.noise(0.03,0.04,600); this.osc(140,"sine",0.04,0.03); }
};

function textWidth(s,sc){return String(s).length*6*sc;}
function drawText(g,str,x,y,col,sc,align,shadow){
  str=String(str).toUpperCase(); sc=sc||1;
  let w=str.length*6*sc, sx=x;
  if(align==="center") sx=Math.round(x-w/2);
  if(align==="right") sx=Math.round(x-w);
  for(let i=0;i<str.length;i++){
    const ch=FL[str[i]]||FL["?"];
    const px=sx+i*6*sc;
    if(shadow!==false){
      g.fillStyle="rgba(0,0,0,0.7)";
      for(let r=0;r<7;r++) for(let c=0;c<5;c++) if(ch[r][c]==="1") g.fillRect(px+c*sc+sc,y+r*sc+sc,sc,sc);
    }
    g.fillStyle=col||"#f0e8d0";
    for(let r=0;r<7;r++) for(let c=0;c<5;c++) if(ch[r][c]==="1") g.fillRect(px+c*sc,y+r*sc,sc,sc);
  }
  return w;
}

/* ---------- procedural textures (128x128 cobblestone) ---------- */
const TEXS={}; // role -> {w,h,data:Uint8ClampedArray}
const SPRS={}; // role -> {w,h,data} or {frames:[{w,h,data},...], w,h,data}

function makeTex(S, fn){
  const data=new Uint8ClampedArray(S*S*4);
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const c=fn(x,y,S);
    const i=(y*S+x)*4;
    data[i]=hex(c[0]); data[i+1]=hex(c[1]); data[i+2]=hex(c[2]); data[i+3]=c[3]==null?255:hex(c[3]);
  }
  return {w:S,h:S,data};
}
function stoneTex(S, seed, opts){
  opts=opts||{};
  const cells=opts.cells||8;
  const cs=S/cells;
  const pal=opts.pal||[[92,86,102],[70,66,84],[112,104,118],[58,56,70],[98,90,108],[80,76,92]];
  const grout=opts.grout||[22,20,28];
  const mossC=opts.moss||[48,72,42];
  const pts=[];
  for(let gy=0;gy<cells;gy++) for(let gx=0;gx<cells;gx++){
    const jit=opts.brick?0.28:0.72;
    const jx=(hash3(gx,gy,seed)-0.5)*jit, jy=(hash3(gx,gy,seed+9)-0.5)*jit;
    const ci=Math.floor(hash3(gx,gy,seed+3)*pal.length);
    pts.push({x:(gx+0.5+jx)*cs, y:(gy+0.5+jy)*cs, c:pal[ci], sh:0.82+hash3(gx,gy,seed+5)*0.32});
  }
  function near(x,y){
    let d1=1e9,d2=1e9,p1=pts[0];
    for(let i=0;i<pts.length;i++){
      const p=pts[i];
      let dx=Math.abs(x-p.x); if(dx>S*0.5) dx=S-dx;
      let dy=Math.abs(y-p.y); if(dy>S*0.5) dy=S-dy;
      const d=dx*dx+dy*dy;
      if(d<d1){d2=d1;d1=d;p1=p;} else if(d<d2) d2=d;
    }
    return {d1:Math.sqrt(d1), d2:Math.sqrt(d2), p:p1};
  }
  return makeTex(S,(x,y)=>{
    const n=near(x,y), h=hash3(x,y,seed+20);
    const edge=n.d2-n.d1;
    if(edge<2.6+h*1.0){
      if(h>0.72) return [mossC[0]+h*22, mossC[1]+h*24, mossC[2]+h*10];
      return [grout[0]+h*12, grout[1]+h*10, grout[2]+h*10];
    }
    let r=n.p.c[0]*n.p.sh, g=n.p.c[1]*n.p.sh, b=n.p.c[2]*n.p.sh;
    r+=(h-0.5)*18; g+=(h-0.5)*16; b+=(h-0.5)*14;
    const hl=Math.max(0, 1-n.d1/(cs*0.45))*0.22;
    r+=hl*48; g+=hl*40; b+=hl*32;
    // faint crack
    if(h>0.97 && edge<8){ r*=0.55; g*=0.55; b*=0.55; }
    return [r,g,b];
  });
}
function ceilingTex(S, seed){
  const base=stoneTex(S, seed, {cells:6, pal:[[48,44,60],[38,36,52],[56,52,68],[32,30,44]], grout:[16,14,22], moss:[30,40,32]});
  // add beams
  const d=base.data;
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const bx=(x+S-8)%(S/2);
    if(bx<10){
      const i=(y*S+x)*4;
      const sh=bx<2||bx>8?0.35:0.55+((x+y)%3)*0.05;
      d[i]=hex(70*sh); d[i+1]=hex(50*sh); d[i+2]=hex(36*sh);
    }
  }
  return base;
}
function doorTex(S){
  return makeTex(S,(x,y)=>{
    const plank=Math.floor(x/22);
    const h=hash3(x,y,40+plank);
    let r=110+h*20+plank*4, g=72+h*14, b=38+h*8;
    if(x%22<2 || x%22>19){ r=50; g=34; b=22; }
    // iron bands
    if((y>28&&y<40)||(y>S-42&&y<S-30)){ r=48+h*10; g=46+h*8; b=52+h*8; if(y===30||y===S-32||y===38||y===S-34){r=80;g=78;b=86;} }
    // handle
    const dx=x-S*0.72, dy=y-S*0.5, dd=dx*dx+dy*dy;
    if(dd<90){ r=160; g=140; b=60; }
    if(dd<40){ r=80; g=70; b=30; }
    // outline
    if(x<3||x>S-4||y<3||y>S-4){ r=24; g=18; b=14; }
    return [r,g,b];
  });
}
function stairsTex(S){
  return makeTex(S,(x,y)=>{
    const cx=S/2, cy=S/2, d=Math.hypot(x-cx,y-cy);
    const ring=Math.floor(d/10);
    if(d<18){
      const glow=0.35+0.35*Math.sin((x+y)*0.2);
      return [80+glow*80, 40+glow*40, 140+glow*80];
    }
    if(d<28) return [18,12,28];
    const h=hash3(x,y,77);
    const step=ring%2;
    let r=70-step*16+h*12, g=66-step*14+h*10, b=80-step*10+h*12;
    if(Math.abs(d-28)<2){ r=120; g=100; b=150; }
    return [r,g,b];
  });
}
function rugTex(S, seed){
  return makeTex(S,(x,y)=>{
    const border=x<10||y<10||x>S-11||y>S-11;
    const h=hash3(x,y,seed);
    if(border){
      const gold=(x<12||y<12||x>S-13||y>S-13)&&(x>6&&y>6&&x<S-7&&y<S-7);
      if(gold) return [160+h*20, 120+h*16, 40];
      return [60, 22, 26];
    }
    const pattern=((Math.floor(x/16)+Math.floor(y/16))%2);
    let r=120-pattern*20+h*10, g=28+h*6, b=36+h*6;
    if((x%32<2)||(y%32<2)){ r=90; g=20; b=26; }
    return [r,g,b];
  });
}

function buildProceduralTextures(){
  TEXS.wall     = stoneTex(TEX, 1,  {cells:8, brick:true});
  TEXS.wall2    = stoneTex(TEX, 11, {cells:7, brick:true, pal:[[86,80,94],[64,62,78],[104,96,110],[50,50,64],[90,84,100]]});
  TEXS.wall3    = stoneTex(TEX, 22, {cells:8, brick:true, pal:[[100,90,88],[74,70,78],[88,82,90],[58,54,66]]});
  TEXS.wall_moss= stoneTex(TEX, 33, {cells:7, moss:[40,90,48], pal:[[70,80,72],[56,68,60],[88,90,80]]});
  TEXS.wall_boss= stoneTex(TEX, 44, {cells:6, pal:[[70,36,68],[50,24,52],[88,44,80],[38,18,40],[96,50,70]], grout:[18,8,20], moss:[60,24,70]});
  TEXS.wall_torch=TEXS.wall;
  TEXS.floor    = stoneTex(TEX, 55, {cells:7, pal:[[138,118,92],[118,104,82],[150,132,100],[100,90,72],[128,112,88]], grout:[40,34,30], moss:[58,80,42]});
  TEXS.floor_boss=stoneTex(TEX, 66, {cells:6, pal:[[80,36,60],[64,28,50],[96,44,70],[50,22,42]], grout:[28,12,24], moss:[70,28,60]});
  TEXS.floor_rug= rugTex(TEX, 7);
  TEXS.ceiling  = ceilingTex(TEX, 88);
  TEXS.door     = doorTex(TEX);
  TEXS.stairs   = stairsTex(TEX);
}

/* ---------- procedural sprites (canvas → pixel buffer) ---------- */
function canv(w,h,fn){
  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  const g=c.getContext("2d");
  g.imageSmoothingEnabled=false;
  fn(g,w,h);
  const im=g.getImageData(0,0,w,h);
  return {w,h,data:im.data, canvas:c};
}
function ell(g,x,y,rx,ry,col){ g.fillStyle=col; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); }
function rct(g,x,y,w,h,col){ g.fillStyle=col; g.fillRect(x|0,y|0,w,h); }
function toBuf(src){ // {w,h,data} already, or canvas
  if(src.data) return src;
  return canv(src.width, src.height, (g)=>{g.drawImage(src,0,0);});
}

function genSlime(frame){
  return canv(64,64,(g,w,h)=>{
    const sq=frame===1?1.15:frame===2?0.9:1;
    const cx=32, cy=40, rw=22*sq, rh=18/sq+(frame===2?3:0);
    ell(g,cx,cy,rw+3,rh+3,"#0c0a12");
    ell(g,cx,cy,rw,rh,"#1e7a30");
    ell(g,cx,cy-1,rw-3,rh-3,"#36b850");
    ell(g,cx-6,cy-7,rw*0.38,rh*0.32,"#8af898");
    // eyes
    const ey=cy-4+(frame===1?1:0);
    rct(g,cx-9,ey-4,7,8,"#0a0a0a"); rct(g,cx+3,ey-4,7,8,"#0a0a0a");
    rct(g,cx-7,ey-3,3,4,"#f0f0f0"); rct(g,cx+5,ey-3,3,4,"#f0f0f0");
    rct(g,cx-6,ey-2,2,2,"#1a1a1a"); rct(g,cx+6,ey-2,2,2,"#1a1a1a");
    // mouth
    if(frame!==2) rct(g,cx-4,cy+4,8,2,"#0a3010");
  });
}
function genBat(frame){
  return canv(80,56,(g)=>{
    const wing=frame===0?1:0.75;
    const flap=frame===0?0:6;
    // wings
    g.fillStyle="#1a0e28";
    g.beginPath(); g.moveTo(40,28); g.lineTo(40-34*wing,18-flap); g.lineTo(40-28*wing,32); g.lineTo(40-36*wing,42+flap); g.lineTo(40,32); g.fill();
    g.beginPath(); g.moveTo(40,28); g.lineTo(40+34*wing,18-flap); g.lineTo(40+28*wing,32); g.lineTo(40+36*wing,42+flap); g.lineTo(40,32); g.fill();
    g.fillStyle="#3a2458";
    g.beginPath(); g.moveTo(40,28); g.lineTo(40-28*wing,22-flap); g.lineTo(40-22*wing,32); g.lineTo(40,30); g.fill();
    g.beginPath(); g.moveTo(40,28); g.lineTo(40+28*wing,22-flap); g.lineTo(40+22*wing,32); g.lineTo(40,30); g.fill();
    // body
    ell(g,40,30,8,11,"#0c0814");
    ell(g,40,30,6,9,"#2a1840");
    // eyes
    rct(g,36,26,4,4,"#c02830"); rct(g,42,26,4,4,"#c02830");
    rct(g,37,27,2,2,"#f0d0d0"); rct(g,43,27,2,2,"#f0d0d0");
    // ears
    rct(g,35,18,4,8,"#1a0e28"); rct(g,43,18,4,8,"#1a0e28");
  });
}
function genGoblin(frame){
  return canv(64,80,(g)=>{
    const bob=frame?1:0;
    // legs
    rct(g,22,60+bob,8,14,"#2a180c"); rct(g,36,60+(1-bob),8,14,"#2a180c");
    rct(g,22,72+bob,8,6,"#3a2010"); rct(g,36,72+(1-bob),8,6,"#3a2010");
    // tunic
    ell(g,32,50,16,14,"#0c0a08");
    ell(g,32,50,14,12,"#5a3a1c");
    rct(g,20,44,24,16,"#6a4824");
    rct(g,22,46,20,12,"#5a3a1c");
    // head
    ell(g,32,30,14,13,"#0c0a08");
    ell(g,32,30,12,11,"#5a8a28");
    // ears
    g.fillStyle="#0c0a08";
    g.beginPath(); g.moveTo(18,28); g.lineTo(10,16); g.lineTo(20,26); g.fill();
    g.beginPath(); g.moveTo(46,28); g.lineTo(54,16); g.lineTo(44,26); g.fill();
    g.fillStyle="#4a7a20";
    g.beginPath(); g.moveTo(19,28); g.lineTo(13,18); g.lineTo(21,26); g.fill();
    g.beginPath(); g.moveTo(45,28); g.lineTo(51,18); g.lineTo(43,26); g.fill();
    // eyes
    rct(g,24,28,6,5,"#f0d040"); rct(g,36,28,6,5,"#f0d040");
    rct(g,26,29,3,3,"#1a1008"); rct(g,38,29,3,3,"#1a1008");
    // nose + teeth
    rct(g,30,33,5,5,"#3a5a18");
    rct(g,27,38,10,3,"#0c0a08"); rct(g,28,38,3,3,"#f0e8d0"); rct(g,35,38,3,3,"#f0e8d0");
    // dagger
    rct(g,48,44+bob,3,16,"#c0c8d8"); rct(g,47,58+bob,5,4,"#8a6a20");
  });
}
function genSkel(frame){
  return canv(64,88,(g)=>{
    const bob=frame?1:0;
    // legs

function robedFigure(w,h,cols, opts){
  // Fully-clothed dignified humanoid. cols: {robe,robeD,robeL,skin,hair,accent,metal,staff}
  return function(frame){
    return canv(w,h,(g)=>{
      const bob=frame?1:0;
      const C=cols;
      const cx=Math.floor(w/2);
      // cloak / gown to the ground
      g.fillStyle="#0c0810";
      g.beginPath(); g.moveTo(8,h-2); g.lineTo(14,h*0.42); g.lineTo(w-14,h*0.42); g.lineTo(w-8,h-2); g.closePath(); g.fill();
      g.fillStyle=C.robeD;
      g.beginPath(); g.moveTo(10,h-3); g.lineTo(16,h*0.42); g.lineTo(w-16,h*0.42); g.lineTo(w-10,h-3); g.closePath(); g.fill();
      g.fillStyle=C.robe;
      g.beginPath(); g.moveTo(16,h-4); g.lineTo(20,h*0.4); g.lineTo(w-20,h*0.4); g.lineTo(w-16,h-4); g.closePath(); g.fill();
      // sleeves / arms folded or holding staff
      rct(g,14,h*0.44,14,h*0.18,C.robe);
      rct(g,w-28,h*0.44,14,h*0.18,C.robe);
      // chest / collar (high collar, fully covered)
      rct(g,cx-12,h*0.36,24,h*0.14,C.robeL||C.robe);
      rct(g,cx-8,h*0.34,16,8,C.accent||C.metal||"#c8a040");
      // head
      if(opts&&opts.helm){
        ell(g,cx,h*0.26,14,16,"#0c0810");
        ell(g,cx,h*0.26,12,14,C.metal||"#607080");
        rct(g,cx-8,h*0.24,16,6,C.glow||"#70e0e0");
      } else if(opts&&opts.hood){
        ell(g,cx,h*0.26,16,18,"#0c0810");
        ell(g,cx,h*0.27,14,16,C.robeD);
        ell(g,cx,h*0.30,8,9,C.skin);
        rct(g,cx-6,h*0.28,4,3,"#1a1020"); rct(g,cx+2,h*0.28,4,3,"#1a1020");
      } else {
        // hair / crown
        if(C.hair){ ell(g,cx,h*0.22,13,12,C.hair); }
        ell(g,cx,h*0.28,10,11,"#0c0810");
        ell(g,cx,h*0.28,8,9,C.skin||"#e8d0b8");
        rct(g,cx-5,h*0.26,3,3,"#1a1020"); rct(g,cx+3,h*0.26,3,3,"#1a1020");
        if(opts&&opts.crown){
          rct(g,cx-10,h*0.16,20,5,C.metal||"#e0c060");
          rct(g,cx-8,h*0.12,4,6,C.metal||"#e0c060");
          rct(g,cx-2,h*0.08,4,8,C.metal||"#e0c060");
          rct(g,cx+4,h*0.12,4,6,C.metal||"#e0c060");
        }
        if(opts&&opts.hat){
          // tall pointed hat
          g.fillStyle="#0c0810";
          g.beginPath(); g.moveTo(cx,4+bob); g.lineTo(cx-18,h*0.26); g.lineTo(cx+18,h*0.26); g.closePath(); g.fill();
          g.fillStyle=C.robe;
          g.beginPath(); g.moveTo(cx,8+bob); g.lineTo(cx-15,h*0.25); g.lineTo(cx+15,h*0.25); g.closePath(); g.fill();
          rct(g,cx-20,h*0.24,40,5,C.robeD);
        }
      }
      // staff
      if(opts&&opts.staff){
        rct(g,w-16,12+bob,4,h-20,C.staff||"#6a4a20");
        ell(g,w-14,14+bob,9,9,C.gem||"#c080ff");
        ell(g,w-14,14+bob,5,5,C.gemL||"#ffe0ff");
      }
      if(opts&&opts.sword){
        rct(g,w-18,h*0.28,5,h*0.5,C.metal||"#c0d0e0");
        rct(g,w-22,h*0.54,13,5,C.accent||"#c8a040");
      }
    });
  };
}

}

/* ---------- art loader: PNG embeds override procedural ---------- */
function bufFromImage(img, sx,sy,sw,sh){
  const c=document.createElement("canvas");
  c.width=sw; c.height=sh;
  const g=c.getContext("2d");
  g.imageSmoothingEnabled=false;
  g.drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
  const im=g.getImageData(0,0,sw,sh);
  return {w:sw,h:sh,data:im.data,canvas:c};
}
function applyEmbed(role, img){
  let frames=null;
  if(img.width>=img.height*2 && img.width%img.height===0 && img.width/img.height<=8){
    const fw=img.height, n=img.width/fw;
    frames=[];
    for(let i=0;i<n;i++) frames.push(bufFromImage(img,i*fw,0,fw,img.height));
  }
  const single=frames?frames[0]:bufFromImage(img,0,0,img.width,img.height);
  // route into TEXS or SPRS by role
  const wallLike=/^(wall|floor|ceiling|door|stairs|ceil)/.test(role);
  if(wallLike){
    TEXS[role]=single;
    if(frames) TEXS[role+"_frames"]=frames;
  } else if(role==="weapon_swing"||role==="weapon_attack"){
    SPRS.weapon_swing=single;
  } else if(role==="weapon"||role==="weapon_hand"||role==="weapon_idle"){
    SPRS.weapon=single;
    if(SPRS.weapons) SPRS.weapons.rusty=single;
  } else if(role.startsWith("weapon_")){
    const k=role.slice(7); // rusty, nightfall, crimson, ...
    if(!SPRS.weapons) SPRS.weapons={};
    SPRS.weapons[k]=single;
    if(k==="rusty") SPRS.weapon=single;
  } else {
    if(frames) SPRS[role]=frames;
    else SPRS[role]=single;
  }
}
function gatherFrameSets(){
  const bases=["slime","bat","goblin","skeleton","skel","spider","acolyte",
    "boss_morgana","boss_vesper","boss_hollow","boss_isolde","boss_ashkar"];
  for(const b of bases){
    const fr=[];
    for(let i=0;i<6;i++){
      const r=SPRS[b+"_"+i]||TEXS[b+"_"+i];
      if(r) fr.push(r);
    }
    if(fr.length){
      SPRS[b]=fr;
    }
  }
  if(SPRS.skel && !SPRS.skeleton) SPRS.skeleton=SPRS.skel;
}
function loadEmbeddedArt(){
  return new Promise(resolve=>{
    const keys=Object.keys(ART_EMBED||{});
    if(!keys.length){ resolve([]); return; }
    let left=keys.length;
    const used=[];
    for(const k of keys){
      const img=new Image();
      img.onload=()=>{ try{ applyEmbed(k,img); used.push(k);}catch(e){_errors.push("art "+k+": "+e);} if(--left===0){gatherFrameSets(); resolve(used);} };
      img.onerror=()=>{ _errors.push("art load fail: "+k); if(--left===0){gatherFrameSets(); resolve(used);} };
      img.src=ART_EMBED[k];

}
function getTex(role){
  return TEXS[role]||TEXS[role.replace(/_stone\d?/,"").replace("_stone","")]||null;
}
function wallTexFor(x,y){
  // boss-adjacent walls
  let boss=false;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx, ny=y+dy;
    if(inB(nx,ny)&&(tiles[ny][nx]===T_BOSS||tiles[ny][nx]===T_RUG)) boss=true;
  }
  if(torches && TEXS.wall_torch && torches.some(t=>Math.abs(t.x-x)+Math.abs(t.y-y)===1)) return TEXS.wall_torch;
  if(boss && TEXS.wall_boss) return TEXS.wall_boss;
  const vars=["wall","wall2","wall3"].filter(r=>TEXS[r]);
  if(hash2(x,y)>0.82 && TEXS.wall_moss) return TEXS.wall_moss;
  return TEXS[vars[Math.floor(hash2(x+3,y)*vars.length)]]||TEXS.wall;
}
function floorTexFor(x,y){
  if(!inB(x,y)) return TEXS.floor;
  const t=tiles[y][x];
  if(t===T_STAIRS && TEXS.stairs) return TEXS.stairs;
  if(t===T_RUG && TEXS.floor_rug) return TEXS.floor_rug;
  if(t===T_BOSS && TEXS.floor_boss) return TEXS.floor_boss;
  return TEXS.floor;
}
function sprFrame(role, t, n){
  let s=SPRS[role];
  if(!s) s=SPRS[role.replace("skel","skeleton")];
  if(!s) return null;
  if(Array.isArray(s)) return s[Math.floor(t)%s.length];
  if(s.frames) return s.frames[Math.floor(t)%s.frames.length];
  return s;
}


/* ---------- dungeon generation (same rules as the top-down game) ---------- */
let tiles, explored, lightMap, torchLight;
let rooms=[], torches=[], decorations=[], items=[], chests=[], monsters=[], stairs=null, startPos=null;
let floorNum=1, bossDefeated=true, currentBoss=null, stairsLocked=false;

function resetMaps(){
  tiles=Array.from({length:MAP_H},()=>Array(MAP_W).fill(T_WALL));
  explored=Array.from({length:MAP_H},()=>Array(MAP_W).fill(false));
  lightMap=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));
  torchLight=Array.from({length:MAP_H},()=>Array(MAP_W).fill(0));
  rooms=[]; torches=[]; decorations=[]; items=[]; chests=[]; monsters=[];
  stairs=null; startPos=null; currentBoss=null;
}
function carveRoom(x,y,w,h,t){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) if(inB(i,j)) tiles[j][i]=t; }
function carveRect(x1,y1,x2,y2,t){
  const xa=Math.min(x1,x2), xb=Math.max(x1,x2), ya=Math.min(y1,y2), yb=Math.max(y1,y2);
  for(let j=ya;j<=yb;j++) for(let i=xa;i<=xb;i++) if(inB(i,j)&&tiles[j][i]===T_WALL) tiles[j][i]=t;
}
function roomCenter(r){return {x:(r.x+Math.floor(r.w/2)), y:(r.y+Math.floor(r.h/2))};}
function roomsOverlap(a,b,pad){ return a.x-pad<b.x+b.w && a.x+a.w+pad>b.x && a.y-pad<b.y+b.h && a.y+a.h+pad>b.y; }
function connectCenters(a,b){
  const ca=roomCenter(a), cb=roomCenter(b);
  if(Math.random()<0.5){
    carveRect(ca.x,ca.y,cb.x,ca.y,T_FLOOR); carveRect(cb.x,ca.y,cb.x,cb.y,T_FLOOR);
    if(Math.random()<0.45){ carveRect(ca.x,ca.y+1,cb.x,ca.y+1,T_FLOOR); carveRect(cb.x+1,ca.y,cb.x+1,cb.y,T_FLOOR); }
  } else {
    carveRect(ca.x,ca.y,ca.x,cb.y,T_FLOOR); carveRect(ca.x,cb.y,cb.x,cb.y,T_FLOOR);
    if(Math.random()<0.45){ carveRect(ca.x+1,ca.y,ca.x+1,cb.y,T_FLOOR); carveRect(ca.x,cb.y+1,cb.x,cb.y+1,T_FLOOR); }
  }
}
function isWall(x,y){return !inB(x,y)||tiles[y][x]===T_WALL||tiles[y][x]===T_PILLAR;}
function isFloorish(x,y){if(!inB(x,y))return false; const t=tiles[y][x]; return t===T_FLOOR||t===T_STAIRS||t===T_BOSS||t===T_RUG;}
function floodFill(sx,sy){
  const seen=new Set(), st=[{x:sx,y:sy}]; seen.add(key(sx,sy));
  while(st.length){
    const p=st.pop();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=p.x+dx, ny=p.y+dy;
      if(isFloorish(nx,ny)&&!seen.has(key(nx,ny))){ seen.add(key(nx,ny)); st.push({x:nx,y:ny}); }
    }
  }
  return seen;
}
function tryGenerate(floor, isBoss){
  resetMaps();
  const maxRooms=isBoss?5:6+Math.min(5,Math.floor(floor/2))+rand(3);
  if(isBoss){
    const bw=13+rand(3), bh=11+rand(3);
    const bx=Math.floor((MAP_W-bw)/2), by=Math.floor((MAP_H-bh)/2)-1;
    carveRoom(bx,by,bw,bh,T_BOSS);
    const rx=bx+3, ry=by+3, rw=bw-6, rh=bh-6;
    if(rw>3&&rh>3) carveRoom(rx,ry,rw,rh,T_RUG);
    rooms.push({x:bx,y:by,w:bw,h:bh,boss:true});
    const corners=[[bx+2,by+2],[bx+bw-3,by+2],[bx+2,by+bh-3],[bx+bw-3,by+bh-3]];
    for(const [px,py] of corners){ if(isFloorish(px,py)){ tiles[py][px]=T_PILLAR; decorations.push({x:px,y:py,type:"pillar"}); } }
  }
  let attempts=0;
  while(rooms.length<maxRooms && attempts<120){
    attempts++;
    const w=6+rand(6), h=6+rand(4);
    const x=2+rand(MAP_W-w-4), y=2+rand(MAP_H-h-4);
    const r={x,y,w,h,boss:false};
    if(rooms.some(o=>roomsOverlap(r,o,2))) continue;
    carveRoom(x,y,w,h,T_FLOOR);
    rooms.push(r);
  }
  if(rooms.length<3) return false;
  const order=rooms.slice();
  for(let i=1;i<order.length;i++){
    let best=i, bd=1e9;
    for(let j=i;j<order.length;j++){
      const d=dist(roomCenter(order[i-1]).x,roomCenter(order[i-1]).y,roomCenter(order[j]).x,roomCenter(order[j]).y);
      if(d<bd){bd=d;best=j;}
    }
    [order[i],order[best]]=[order[best],order[i]];
    connectCenters(order[i-1], order[i]);
  }
  for(let i=0;i<1+rand(3);i++){
    const a=choice(rooms), b=choice(rooms);
    if(a!==b) connectCenters(a,b);
  }
  const startCandidates=rooms.filter(r=>!r.boss);
  startCandidates.sort((a,b)=>b.w*b.h-a.w*a.h);
  const startRoom=startCandidates[0]||rooms[0];
  startPos=roomCenter(startRoom);
  let stairsRoom;
  if(isBoss) stairsRoom=rooms.find(r=>r.boss)||rooms[rooms.length-1];
  else {
    let fd=-1;
    for(const r of rooms){ const c=roomCenter(r), d=dist(startPos.x,startPos.y,c.x,c.y); if(d>fd){fd=d;stairsRoom=r;} }
  }
  const sc=roomCenter(stairsRoom);
  let sx=sc.x, sy=sc.y;
  if(isBoss){ sx=stairsRoom.x+stairsRoom.w-2; sy=stairsRoom.y+1; if(!isFloorish(sx,sy)){sx=sc.x;sy=stairsRoom.y+1;} }
  if(!isFloorish(sx,sy)){ sx=sc.x; sy=sc.y; }
  tiles[sy][sx]=T_STAIRS;
  stairs={x:sx,y:sy};
  const reached=floodFill(startPos.x,startPos.y);
  if(!reached.has(key(stairs.x,stairs.y))) return false;
  for(const r of rooms){
    const c=roomCenter(r);
    if(isFloorish(c.x,c.y)&&!reached.has(key(c.x,c.y))) connectCenters(startRoom,r);
  }
  return true;
}
function fallbackGen(floor,isBoss){
  resetMaps();
  const rw=isBoss?15:20, rh=isBoss?13:14;
  const rx=Math.floor((MAP_W-rw)/2), ry=Math.floor((MAP_H-rh)/2);
  carveRoom(rx,ry,rw,rh,isBoss?T_BOSS:T_FLOOR);
  rooms.push({x:rx,y:ry,w:rw,h:rh,boss:!!isBoss});
  const r2={x:rx-12,y:ry+2,w:8,h:8,boss:false};
  if(r2.x>=2){ carveRoom(r2.x,r2.y,r2.w,r2.h,T_FLOOR); rooms.push(r2); connectCenters(r2,rooms[0]); startPos=roomCenter(r2); }
  else startPos={x:rx+2,y:ry+rh-2};
  stairs={x:rx+rw-2,y:ry+1};
  tiles[stairs.y][stairs.x]=T_STAIRS;
  if(isBoss) carveRoom(rx+4,ry+3,rw-8,rh-6,T_RUG);
}
function placeFeatures(floor,isBoss){
  const torchSpots=[];
  for(let y=1;y<MAP_H-1;y++) for(let x=1;x<MAP_W-1;x++){
    if(isFloorish(x,y)&&isWall(x,y-1)) torchSpots.push({x,y:y-1,lightX:x,lightY:y});
  }
  for(let i=torchSpots.length-1;i>0;i--){ const j=rand(i+1); [torchSpots[i],torchSpots[j]]=[torchSpots[j],torchSpots[i]]; }
  for(const s of torchSpots){
    if(torches.some(t=>dist(t.x,t.y,s.x,s.y)<5)) continue;
    if(Math.random()<0.55||torches.length<4){
      torches.push(s);
      if(torches.length>=(isBoss?10:8+Math.min(8,floor))) break;
    }
  }
  const startRoom=rooms.find(r=>startPos&&r.x<=startPos.x&&startPos.x<r.x+r.w&&r.y<=startPos.y&&startPos.y<r.y+r.h);
  if(startRoom){
    for(const x of [startRoom.x+1, startRoom.x+startRoom.w-2, startRoom.x+Math.floor(startRoom.w/2)]){
      const fy=startRoom.y;
      if(isFloorish(x,fy)&&isWall(x,fy-1)&&!torches.some(t=>t.x===x&&t.y===fy-1))
        torches.push({x,y:fy-1,lightX:x,lightY:fy});
    }
  }
  for(const r of rooms){
    for(let k=0;k<randi(0,3);k++){
      const x=r.x+1+rand(Math.max(1,r.w-2)), y=r.y+1+rand(Math.max(1,r.h-2));
      if(!isFloorish(x,y)||(x===startPos.x&&y===startPos.y)||(stairs&&x===stairs.x&&y===stairs.y)) continue;
      if(tiles[y][x]===T_PILLAR) continue;
      decorations.push({x,y,type:choice(["bones","mushroom"])});
    }
  }
}
function occupied(x,y){
  if(!isFloorish(x,y)) return true;
  if(startPos&&x===startPos.x&&y===startPos.y) return true;
  if(stairs&&x===stairs.x&&y===stairs.y) return true;
  if(monsters.some(m=>m.x===x&&m.y===y&&m.hp>0)) return true;
  if(chests.some(c=>c.x===x&&c.y===y)) return true;
  if(items.some(it=>it.x===x&&it.y===y)) return true;
  if(tiles[y][x]===T_PILLAR) return true;
  return false;
}
function randomFloorInRoom(r,tries=20){
  for(let i=0;i<tries;i++){ const x=r.x+rand(r.w), y=r.y+rand(r.h); if(!occupied(x,y)&&isFloorish(x,y)) return {x,y}; }
  return null;
}
function randomFloor(tries=40){
  const cands=rooms.filter(r=>!r.boss||rooms.length===1);
  for(let i=0;i<tries;i++){ const r=choice(cands.length?cands:rooms); const p=randomFloorInRoom(r); if(p) return p; }
  return null;
}

    for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
      const d=dist(x,y,startPos.x,startPos.y);
      if(d>=4&&d<=7&&isFloorish(x,y)&&!occupied(x,y)) spots.push({x,y});
    }
    if(spots.length){ const s=spots[Math.floor(spots.length/3)]||spots[0]; spawnMonster(choice(["slime","bat","slime"]),s.x,s.y,floor); }
  }
}
function generateFloor(floor){
  const isBoss=(floor%3===0);
  let ok=false;
  for(let i=0;i<25;i++){ if(tryGenerate(floor,isBoss)){ ok=true; break; } }
  if(!ok) fallbackGen(floor,isBoss);
  placeFeatures(floor,isBoss);
  populate(floor,isBoss);
  stairsLocked=isBoss&&monsters.some(m=>m.isBoss&&m.hp>0);
  bossDefeated=!stairsLocked;
}

function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx-dy, x=x0, y=y0;
  while(true){
    if(x===x1&&y===y1) return true;
    const e2=2*err;
    let nx=x, ny=y;
    if(e2>-dy){ err-=dy; nx=x+sx; }
    if(e2<dx){ err+=dx; ny=y+sy; }
    if(!(nx===x1&&ny===y1)&&isWall(nx,ny)) return false;
    x=nx; y=ny;
    if(!inB(x,y)) return false;
  }
}
function computeLight(tm){
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){ lightMap[y][x]=0; torchLight[y][x]=0; }
  function addLight(lx,ly,radius,warm,flick){
    const R=radius, x0=Math.max(0,Math.floor(lx-R-1)), x1=Math.min(MAP_W-1,Math.ceil(lx+R+1));
    const y0=Math.max(0,Math.floor(ly-R-1)), y1=Math.min(MAP_H-1,Math.ceil(ly+R+1));
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      const d=Math.hypot(x-lx,y-ly);
      if(d>R) continue;
      if(d>1.4 && !los(Math.round(lx),Math.round(ly),x,y) && !isWall(x,y)){
        if(!los(Math.round(lx),Math.round(ly),x,y)) continue;
      }
      let v=(1-d/R); v=v*v*(3-2*v)*flick;
      if(v>lightMap[y][x]) lightMap[y][x]=v;
      if(warm&&v>torchLight[y][x]) torchLight[y][x]=v*warm;
    }
  }
  addLight(camX,camY,7.2,0.22,1);
  for(let i=0;i<torches.length;i++){
    const t=torches[i];
    const flick=0.86+0.14*Math.sin(tm*6.2+i*1.7)+0.06*Math.sin(tm*13+i);
    addLight(t.lightX,t.lightY,5.0,0.95,clamp(flick,0.7,1.2));
  }
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
    if(lightMap[y][x]>0) lightMap[y][x]=clamp(lightMap[y][x]*1.05+0.12,0.08,1);
  }
}
function lightAt(x,y){
  const ix=clamp(Math.floor(x),0,MAP_W-2), iy=clamp(Math.floor(y),0,MAP_H-2);
  const fx=x-ix, fy=y-iy;
  const a=lightMap[iy][ix], b=lightMap[iy][ix+1], c=lightMap[iy+1][ix], d=lightMap[iy+1][ix+1];
  return lerp(lerp(a,b,fx), lerp(c,d,fx), fy);
}
function warmAt(x,y){
  const ix=clamp(Math.floor(x),0,MAP_W-2), iy=clamp(Math.floor(y),0,MAP_H-2);
  const fx=x-ix, fy=y-iy;
  const a=torchLight[iy][ix], b=torchLight[iy][ix+1], c=torchLight[iy+1][ix], d=torchLight[iy+1][ix+1];
  return lerp(lerp(a,b,fx), lerp(c,d,fx), fy);
}

function monAt(x,y,ignore){ for(const m of monsters) if(m.alive&&m.hp>0&&m!==ignore&&m.x===x&&m.y===y) return m; return null; }
function chestAt(x,y){ return chests.find(c=>c.x===x&&c.y===y&&!c.open); }
function canWalk(x,y,mover){
  if(!isFloorish(x,y)) return false;
  if(player.alive&&mover!==player&&x===player.x&&y===player.y) return false;
  if(monAt(x,y,mover)) return false;
  if(tiles[y][x]===T_PILLAR) return false;
  return true;
}
function ahead(){ const d=DIR[player.facing]; return {x:player.x+d.x, y:player.y+d.y}; }

function applyWeaponFX(attacker,defender,dmg){
  if(!attacker.isPlayer) return;
  const w=WEAPONS[player.weapon];
  if(!w||!w.effect) return;
  if(w.effect==="lifesteal"){
    const h=Math.max(1,Math.floor(dmg*0.35));
    player.hp=Math.min(player.maxHp,player.hp+h);
    addFloat(player.x+0.5,player.y+0.5,"+"+h,"#80ff90");
  } else if(w.effect==="slow"){ defender.slow=Math.max(defender.slow||0,2); msg(defender.name+" is bound by shadow.","#c0a0ff"); }
  else if(w.effect==="freeze"){ if(Math.random()<0.45){ defender.freeze=Math.max(defender.freeze||0,2); msg(defender.name+" is frozen!","#a0d8ff"); SFX.freeze(); } }
  else if(w.effect==="burn"){ defender.burn=Math.max(defender.burn||0,3); msg(defender.name+" is set alight.","#ff8844"); }
}
function dealDamage(attacker, defender, opts){
  opts=opts||{};
  let atk=attacker.isPlayer?playerAtk():attacker.atk;
  let defn=defender.isPlayer?playerDef():defender.def;
  if(opts.pierce||(attacker.isPlayer&&WEAPONS[player.weapon]&&WEAPONS[player.weapon].effect==="pierce")) defn=Math.floor(defn*0.25);
  if(opts.power) atk=Math.floor(atk*opts.power);
  let dmg=atk-defn+randi(-1,1);
  dmg=Math.max(opts.min!=null?opts.min:1, dmg);
  let crit=false;
  if(!opts.noCrit && Math.random()<(opts.critChance||0.1)){ dmg=Math.floor(dmg*1.75)+1; crit=true; }
  defender.hp-=dmg;
  defender.flash=160;
  const wx=(defender.isPlayer?player.x:defender.x)+0.5, wy=(defender.isPlayer?player.y:defender.y)+0.5;
  addFloat(wx, wy, (crit?"!":"")+dmg, crit?"#ffee88":(defender.isPlayer?"#ff6060":"#ffe8e0"));
  if(defender.isPlayer){ shake(crit?8:5,280); SFX.hurt(); redFlash=1; }
  else { shake(crit?6:3,200); if(crit) SFX.crit(); else SFX.hit(); }
  if(attacker.isPlayer) applyWeaponFX(attacker,defender,dmg);
  if(opts.drain){
    attacker.hp=Math.min(attacker.maxHp, attacker.hp+Math.max(1,Math.floor(dmg*0.5)));
    addFloat(attacker.x+0.5,attacker.y+0.5,"+"+Math.max(1,Math.floor(dmg*0.5)),"#ff8080");
    SFX.drain();
  }
  if(defender.hp<=0){ defender.hp=0; killEnt(defender,attacker); }
  return dmg;
}
function killEnt(ent, killer){
  ent.alive=false; ent.hp=0;
  SFX.die();
  if(ent.isPlayer){ onPlayerDeath(); return; }
  if(killer&&killer.isPlayer){
    const xp=ent.xp||5;
    const g=ent.gold?randi(ent.gold[0],ent.gold[1]):0;
    player.xp+=xp; if(g) player.gold+=g;
    msg((ent.isBoss?(ent.name+" falls!"):(ent.name+" is slain."))+" +"+xp+" XP"+(g?" +"+g+" gold":""), ent.isBoss?"#ffd070":"#c8e0b0");
    addFloat(ent.x+0.5,ent.y+0.5,"+"+xp+" XP","#d0f080");
    checkLevelUp();
    if(ent.isBoss){
      bossDefeated=true; stairsLocked=false; currentBoss=null;
      const wid=ent.weaponDrop;
      if(wid&&WEAPONS[wid]){
        items.push({x:ent.x,y:ent.y,type:"weapon",weapon:wid,special:true});
        msg("A relic remains: "+WEAPONS[wid].name+"!","#ffd070");
      }
      items.push({x:ent.x,y:Math.min(MAP_H-2,ent.y+1),type:"gold",amount:randi(20,40)+floorNum*3});
      items.push({x:Math.max(1,ent.x-1),y:ent.y,type:"potion"});
      banner={text:"MINI BOSS DEFEATED",sub:"The seal on the stairs fades.",t:0,color:"#ffd070",life:2200};
    }
  }
}
function checkLevelUp(){
  let ups=0;
  while(player.xp>=xpNeeded(player.level)){
    player.xp-=xpNeeded(player.level);
    player.level++; player.baseAtk+=1;
    if(player.level%2===0) player.baseDef+=1;
    const hpGain=6+Math.floor(player.level/2);
    player.maxHp+=hpGain; player.hp=Math.min(player.maxHp,player.hp+hpGain+4);
    ups++;
  }
  if(ups){
    SFX.levelup();
    banner={text:"LEVEL "+player.level,sub:"Strength and vitality grow.",t:0,color:"#ffe080",life:1800};
    msg("You reach level "+player.level+"!","#ffe080");
  }
}
function onPlayerDeath(){ player.alive=false; mode="dead"; SFX.gameover(); msg("You have fallen...","#ff6060"); }

function pickupAt(x,y){
  const left=[];
  for(const it of items){
    if(it.x===x&&it.y===y){
      if(it.type==="potion"){
        if(player.potions>=9){ msg("You can't carry more potions.","#c0b8a0"); left.push(it); continue; }
        player.potions++; msg("Picked up a crimson potion.","#f0a0b0"); SFX.pickup();
      } else if(it.type==="gold"){
        player.gold+=it.amount||5; msg("Picked up "+(it.amount||5)+" gold.","#ffe080"); SFX.gold();
      } else if(it.type==="weapon"){
        const nw=WEAPONS[it.weapon], ow=WEAPONS[player.weapon];
        if(nw&&(it.special||nw.atk>=ow.atk)){
          player.weapon=it.weapon;
          msg("Equipped "+nw.name+(nw.desc?": "+nw.desc:"."),"#ffd070"); SFX.pickup();
          if(it.special) banner={text:nw.name,sub:nw.desc||"A unique weapon.",t:0,color:"#ffd070",life:2000};
        } else { msg("You leave the "+(nw?nw.name:"weapon")+" (weaker).","#c0b8a0"); left.push(it); }
      } else if(it.type==="armor"){
        const na=ARMORS[it.armor], oa=ARMORS[player.armor];
        if(na&&na.def>=oa.def){ player.armor=it.armor; msg("Equipped "+na.name+".","#a0c8ff"); SFX.pickup(); }
        else { msg("You leave the "+(na?na.name:"armor")+".","#c0b8a0"); left.push(it); }
      }
    } else left.push(it);
  }
  items=left;
}
function openChest(c){
  c.open=true; SFX.open();
  const roll=Math.random();
  if(roll<0.35){ const amt=randi(8,16)+floorNum*2; player.gold+=amt; msg("The chest holds "+amt+" gold.","#ffe080"); }
  else if(roll<0.55){
    if(player.potions<9){ player.potions++; msg("The chest holds a crimson potion.","#f0a0b0"); }
    else { const amt=randi(6,12); player.gold+=amt; msg("Potions full. You take "+amt+" gold instead.","#ffe080"); }
  } else if(roll<0.8){
    const w=pickWeapon(floorNum); const nw=WEAPONS[w], ow=WEAPONS[player.weapon];
    if(nw.atk>=ow.atk){ player.weapon=w; msg("You found a "+nw.name+"!","#ffd070"); }
    else { player.gold+=randi(5,12); msg("A worn blade, sold later for gold.","#c0b8a0"); }
  } else {
    const a=pickArmor(floorNum); const na=ARMORS[a], oa=ARMORS[player.armor];
    if(na.def>=oa.def){ player.armor=a; msg("You found "+na.name+"!","#a0c8ff"); }
    else { player.gold+=randi(5,12); msg("Old armor, worth a few coins.","#c0b8a0"); }
  }
}

function afterPlayerTurn(){
  animating=true;
  if(player.burn>0){ player.burn--; const d=2+Math.floor(floorNum/3); player.hp-=d; addFloat(player.x+0.5,player.y+0.5,""+d,"#ff8844"); if(player.hp<=0){ player.hp=0; onPlayerDeath(); animating=false; return; } }
  const actors=monsters.filter(m=>m.alive&&m.hp>0);
  let i=0;
  function next(){
    if(mode!=="play"){ animating=false; return; }
    while(i<actors.length&&(!actors[i].alive||actors[i].hp<=0)) i++;
    if(i>=actors.length){
      animating=false;
      if(queued){ const q=queued; queued=null; dispatch(q); }
      return;
    }
    const m=actors[i++];
    actMonster(m, next);
  }
  next();
}
function stepToward(m,tx,ty){
  const opts=[];
  const dx=Math.sign(tx-m.x), dy=Math.sign(ty-m.y);
  if(dx) opts.push({dx,dy:0});
  if(dy) opts.push({dx:0,dy});
  if(Math.abs(tx-m.x)<Math.abs(ty-m.y)) opts.reverse();
  opts.push({dx:dx||choice([-1,1]),dy:0});
  opts.push({dx:0,dy:dy||choice([-1,1])});
  for(const o of opts){
    const nx=m.x+o.dx, ny=m.y+o.dy;
    if(canWalk(nx,ny,m)||(nx===player.x&&ny===player.y)) return o;
  }
  return null;
}
function launchBolt(m,color,onHit,speed){
  projectiles.push({x:m.x+0.5,y:m.y+0.5,tx:player.x+0.5,ty:player.y+0.5,color,t:0,life:speed||280,onHit,r:0.15});
  SFX.magic();
}
function playerDefender(){
  const def={isPlayer:true};
  Object.defineProperty(def,"hp",{get(){return player.hp;},set(v){player.hp=v;}});
  Object.defineProperty(def,"flash",{get(){return player.flash;},set(v){player.flash=v;}});
  Object.defineProperty(def,"maxHp",{get(){return player.maxHp;}});
  Object.defineProperty(def,"x",{get(){return player.x;}});
  Object.defineProperty(def,"y",{get(){return player.y;}});
  return def;
}
function actMonster(m, done){
  if(m.burn>0){ m.burn--; const d=2+Math.floor(floorNum/4); m.hp-=d; addFloat(m.x+0.5,m.y+0.5,""+d,"#ff8844"); if(m.hp<=0){ killEnt(m,{isPlayer:true}); done(); return; } }
  if(m.freeze>0){ m.freeze--; addFloat(m.x+0.5,m.y+0.5,"--","#a0d8ff"); done(); return; }
  const slowed=m.slow>0; if(m.slow>0) m.slow--;
  if(slowed && Math.floor(time)%2===0){ done(); return; }
  const d=dist(m.x,m.y,player.x,player.y);
  const inSight=los(m.x,m.y,player.x,player.y)&&d<=10;
  if(m.isBoss&&inSight&&!m.seen){
    m.seen=true;
    banner={text:m.name+", "+m.title,sub:"Mini Boss",t:0,color:m.color||"#ffd070",life:2400};
    SFX.boss(); msg(m.intro,m.color||"#ffd070");
  }
  function hitP(opts){ dealDamage(m, playerDefender(), opts||{}); done(); }

  if(m.isBoss&&inSight){
    m.cd=(m.cd||0)+1;
    if(m.pattern==="bolts"){
      if(d<=2&&m.teleCd<=0){
        const spots=[];
        for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
          const dd=dist(x,y,player.x,player.y);
          if(dd>=4&&dd<=7&&canWalk(x,y,m)&&los(x,y,player.x,player.y)) spots.push({x,y});
        }
        if(spots.length){
          const s=choice(spots);
          m.x=s.x; m.y=s.y; m.teleCd=3;
          SFX.magic(); msg(m.name+" folds into shadow and reappears.","#c0a0ff");
          done(); return;
        }
      }
      if(m.teleCd>0) m.teleCd--;
      if(m.cd%2===0&&inSight){ msg(m.name+" looses a bolt of night.","#c0a0ff"); launchBolt(m,"#c080ff",()=>hitP({power:1.1}),300); return; }
      if(d<4){
        const ox=-Math.sign(player.x-m.x), oy=-Math.sign(player.y-m.y);
        if(canWalk(m.x+ox,m.y,m)){ m.x+=ox; done(); return; }
        if(canWalk(m.x,m.y+oy,m)){ m.y+=oy; done(); return; }
      }
    } else if(m.pattern==="drain"){
      if(d===1){ if(m.cd%3===0){ msg(m.name+" drinks deeply.","#e05060"); SFX.drain(); hitP({power:1.15,drain:true}); return; } hitP({}); return; }
      if(d===2&&m.cd%4===0){
        msg(m.name+" lunges with sudden grace.","#e05060");
        const o=stepToward(m,player.x,player.y);
        if(o){ const tx=m.x+o.dx, ty=m.y+o.dy; if(tx===player.x&&ty===player.y){ hitP({power:1.2}); return; } m.x=tx; m.y=ty; if(dist(m.x,m.y,player.x,player.y)===1) hitP({power:1.2}); else done(); return; }
      }
    } else if(m.pattern==="charge"){
      if(m.cd%4===0&&inSight&&(m.x===player.x||m.y===player.y)){
        msg(m.name+" charges in a straight line!","#70e0e0"); SFX.charge();
        const dx=Math.sign(player.x-m.x), dy=Math.sign(player.y-m.y);
        let cx=m.x, cy=m.y, last={x:m.x,y:m.y};
        for(let s=0;s<8;s++){
          const nx=cx+dx, ny=cy+dy;
          if(nx===player.x&&ny===player.y) break;
          if(!canWalk(nx,ny,m)) break;
          last={x:nx,y:ny}; cx=nx; cy=ny;
        }
        m.x=last.x; m.y=last.y;
        if(dist(m.x,m.y,player.x,player.y)===1) hitP({power:1.45}); else done();
        return;
      }
      if(d===1){ hitP({power:1.05}); return; }
    } else if(m.pattern==="nova"){
      if(m.cd%3===0){
        msg(m.name+" calls a ring of winter.","#a0d8ff"); SFX.freeze();
        if(d<=2){ dealDamage(m,playerDefender(),{power:1.2}); if(Math.random()<0.4){ player.skip=1; msg("Frost grips your steps!","#a0d8ff"); } }
        done(); return;
      }
      if(d===1){ hitP({}); return; }
    } else if(m.pattern==="inferno"){
      if(m.cd%3===0){
        msg(m.name+" breathes a fan of cinders.","#ff8844"); SFX.fire();
        launchBolt(m,"#ff8020",()=>{ hitP({power:1.15}); player.burn=Math.max(player.burn,2); },260);
        return;
      }
      if(d===1){ hitP({}); return; }
    }
  }
  if(d===1){
    hitP({});
    if(m.ai==="web"&&Math.random()<0.28){ player.skip=Math.max(player.skip,1); msg("Sticky webs catch your feet!","#c0a080"); }
    return;
  }
  if(m.ai==="ranged"&&inSight&&d>=2&&d<=6){
    m.cd=(m.cd||0)+1;
    if(m.cd%3===0){ msg(m.name+" casts a dark spark.","#c080e0"); launchBolt(m,"#c080e0",()=>hitP({power:0.9}),280); return; }
    if(d<3){
      const ox=-Math.sign(player.x-m.x), oy=-Math.sign(player.y-m.y);
      if(canWalk(m.x+ox,m.y,m)){ m.x+=ox; done(); return; }
      if(canWalk(m.x,m.y+oy,m)){ m.y+=oy; done(); return; }
    }
  }
  let shouldChase=inSight||(m._lx!=null);
  if(inSight){ m._lx=player.x; m._ly=player.y; }
  if(m.ai==="slow"){ m.cd=(m.cd||0)+1; if(m.cd%2===0){ done(); return; } }
  if(m.ai==="erratic"&&(!inSight||Math.random()<0.35)){
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(o=>canWalk(m.x+o[0],m.y+o[1],m));
    if(dirs.length){ const o=choice(dirs); m.x+=o[0]; m.y+=o[1]; done(); return; }
  }
  if(shouldChase){
    const o=stepToward(m, inSight?player.x:(m._lx??player.x), inSight?player.y:(m._ly??player.y));
    if(o){
      const nx=m.x+o.dx, ny=m.y+o.dy;
      if(nx===player.x&&ny===player.y){ hitP({}); return; }
      if(canWalk(nx,ny,m)){ m.x=nx; m.y=ny; done(); return; }
    }
  } else if(Math.random()<0.4){
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(o=>canWalk(m.x+o[0],m.y+o[1],m));
    if(dirs.length){ const o=choice(dirs); m.x+=o[0]; m.y+=o[1]; done(); return; }
  }
  done();
}

function descend(){
  SFX.stairs();
  floorNum++;
  banner={text:"FLOOR "+floorNum, sub:(floorNum%3===0)?"A presence waits below.":"The air grows heavier.", t:0, color:(floorNum%3===0)?"#ff9090":"#e0d8c0", life:1600};
  msg("You descend the stairs to floor "+floorNum+".","#d0c8ff");
  const hpKeep=player.hp;
  generateFloor(floorNum);
  player.x=startPos.x; player.y=startPos.y;
  player.facing=pickStartFacing();
  snapCam();
  player.hp=Math.min(player.maxHp, hpKeep+Math.ceil(player.maxHp*0.08));
  markExploredAround();
  animating=false; queued=null; fadeIn=1;
}
function pickStartFacing(){
  let best=0, bd=-1;
  for(let f=0;f<4;f++){
    const d=DIR[f]; let n=0;
    for(let k=1;k<8;k++){
      const x=player.x+d.x*k, y=player.y+d.y*k;
      if(!isFloorish(x,y)) break;
      n=k;
    }
    if(n>bd){ bd=n; best=f; }
  }
  return best;
}
function snapCam(){ camX=player.x+0.5; camY=player.y+0.5; camA=player.facing*Math.PI/2; }
function markExploredAround(){
  if(!player) return;
  explored[player.y][player.x]=true;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const x=player.x+dx, y=player.y+dy;
    if(inB(x,y)) explored[y][x]=true;
  }
}


/* ---------- player actions (grid, turn-based; turning is free) ---------- */
function beginAnim(a){ anim=a; anim.t=0; animating=true; }
function finishMove(){
  pickupAt(player.x, player.y);
  if(stairs && player.x===stairs.x && player.y===stairs.y && !stairsLocked){ descend(); return; }
  markExploredAround();
  afterPlayerTurn();
}
function tryWalk(dx, dy){
  if(mode!=="play"||!player.alive) return;
  if(animating){ queued={walk:true,dx,dy}; return; }
  if(player.skip>0){ player.skip--; msg("You struggle to move!","#c0a0ff"); afterPlayerTurn(); return; }
  const nx=player.x+dx, ny=player.y+dy;
  if(!inB(nx,ny)||isWall(nx,ny)||tiles[ny][nx]===T_PILLAR){ SFX.bump(); shake(1.5,80); return; }
  const m=monAt(nx,ny);
  if(m){ msg("A "+m.name+" blocks the way.","#e0c0a0"); SFX.bump(); return; }
  const ch=chestAt(nx,ny);
  if(ch){ openChest(ch); afterPlayerTurn(); return; }
  if(stairs&&nx===stairs.x&&ny===stairs.y&&stairsLocked){ SFX.seal(); msg("A dark seal bars the stairs until the master of this floor falls.","#c0a0ff"); return; }
  SFX.step();
  const ox=player.x, oy=player.y;
  player.x=nx; player.y=ny;
  beginAnim({type:"move", dur:220, x0:ox+0.5,y0:oy+0.5, x1:nx+0.5,y1:ny+0.5, ondone:finishMove});
}
function tryForward(){ const d=DIR[player.facing]; tryWalk(d.x,d.y); }
function tryBack(){ const d=DIR[player.facing]; tryWalk(-d.x,-d.y); }
function tryStrafe(side){ // -1 left, +1 right
  const d=DIR[(player.facing + (side<0?3:1))&3];
  tryWalk(d.x,d.y);
}
function tryTurn(dir){ // -1 left (CCW), +1 right (CW)
  if(mode!=="play"||!player.alive) return;
  if(animating){ queued={turn:true,dir}; return; }
  const nf=(player.facing+dir+4)&3;
  const a0=camA, a1=nf*Math.PI/2;
  // shortest angle
  let da=a1-a0;
  while(da>Math.PI) da-=Math.PI*2;
  while(da<-Math.PI) da+=Math.PI*2;
  player.facing=nf;
  SFX.turn();
  beginAnim({type:"turn", dur:200, a0:camA, a1:camA+da, ondone:()=>{ camA=nf*Math.PI/2; animating=false; markExploredAround(); if(queued){ const q=queued; queued=null; dispatch(q);} }});
  // turning is free — no monster turn
}
function tryAttack(){
  if(mode!=="play"||!player.alive) return;
  if(animating){ queued={attack:true}; return; }
  weaponAnim={t:0,dur:320,active:true};
  SFX.swing();
  const a=ahead();
  const m=monAt(a.x,a.y);
  const ch=chestAt(a.x,a.y);
  animating=true;
  // damage mid-swing
  beginAnim({type:"attack", dur:320, struck:false, ondone:()=>{
    weaponAnim.active=false;
    if(m&&m.alive) afterPlayerTurn();
    else if(ch){ /* already opened mid */ afterPlayerTurn(); }
    else { animating=false; if(queued){ const q=queued; queued=null; dispatch(q);} }
  }});
  // schedule strike
  anim.strikeAt=110;
  anim.m=m; anim.ch=ch;
}
function strikeNow(){
  if(!anim||anim.struck) return;
  anim.struck=true;
  if(anim.m&&anim.m.alive){ dealDamage({isPlayer:true}, anim.m, {}); }
  else if(anim.ch&&!anim.ch.open){ openChest(anim.ch); }
  else { /* whiff — no turn, handled in ondone */ }
}
function waitTurn(){
  if(mode!=="play") return;
  if(animating){ queued={wait:true}; return; }
  msg("You wait.","#a0a098");
  afterPlayerTurn();
}
function usePotion(){
  if(mode!=="play") return;
  if(animating){ queued={potion:true}; return; }
  if(player.potions<=0){ msg("No potions left.","#c0b8a0"); SFX.bump(); return; }
  if(player.hp>=player.maxHp){ msg("You are already in full health.","#c0b8a0"); return; }
  player.potions--;
  const heal=14+player.level*2;
  const got=Math.min(player.maxHp-player.hp, heal);
  player.hp+=got;
  msg("You drink a potion and recover "+got+" HP.","#80ff90");
  addFloat(player.x+0.5,player.y+0.5,"+"+got,"#80ff90");
  SFX.potion();
  afterPlayerTurn();
}
function dispatch(q){
  if(!q) return;
  if(q.walk) tryWalk(q.dx,q.dy);
  else if(q.turn) tryTurn(q.dir);
  else if(q.attack) tryAttack();
  else if(q.wait) waitTurn();
  else if(q.potion) usePotion();
}
function tickAnim(dt){
  if(weaponAnim.active){ weaponAnim.t+=dt; if(weaponAnim.t>=weaponAnim.dur) weaponAnim.active=false; }
  if(!anim) return;
  anim.t+=dt;
  const t=clamp(anim.t/anim.dur,0,1);
  const s=smooth(t);
  if(anim.type==="move"){
    camX=lerp(anim.x0,anim.x1,s);
    camY=lerp(anim.y0,anim.y1,s);
    camBob=Math.sin(s*Math.PI)*0.045;
  } else if(anim.type==="turn"){
    camA=lerp(anim.a0,anim.a1,s);
    camBob=0;
  } else if(anim.type==="attack"){
    if(!anim.struck && anim.t>=(anim.strikeAt||110)) strikeNow();
  }
  if(t>=1){
    if(anim.type==="move"){ camX=anim.x1; camY=anim.y1; camBob=0; }
    if(anim.type==="turn"){ camA=anim.a1; }
    const cb=anim.ondone; anim=null;
    if(cb) cb();
  }
  // projectiles
  const left=[];
  for(const p of projectiles){
    p.t+=dt;
    const u=clamp(p.t/p.life,0,1);
    p.cx=lerp(p.x,p.tx,u); p.cy=lerp(p.y,p.ty,u);
    if(u>=1){ if(p.onHit) p.onHit(); }
    else left.push(p);
  }
  projectiles=left;
  for(const m of monsters) if(m.flash>0) m.flash-=dt;
  if(player&&player.flash>0) player.flash-=dt;
}

/* ---------- RAYCASTER ---------- */
function sample(tex, tx, ty){
  if(!tex||!tex.data) return [0,0,0,0];
  let x=tx|0, y=ty|0;
  const w=tex.w, h=tex.h;
  x=((x%w)+w)%w; y=((y%h)+h)%h;
  const i=(y*w+x)*4;
  const d=tex.data;
  return [d[i],d[i+1],d[i+2],d[i+3]];
}
function shadeRGB(r,g,b, dist, lx, ly, side){
  let sh=1/(1+dist*0.16);
  const L=inB(Math.floor(lx),Math.floor(ly))? lightAt(lx,ly) : 0.2;
  const W=inB(Math.floor(lx),Math.floor(ly))? warmAt(lx,ly) : 0;
  sh*=clamp(0.18+L*0.95, 0.08, 1);
  if(side) sh*=0.72;
  r=r*sh + W*40; g=g*sh + W*22; b=b*sh + W*6;
  // distance fog toward deep purple-black
  const fog=clamp((dist-2)/12,0,1);
  r=r*(1-fog)+8*fog; g=g*(1-fog)+6*fog; b=b*(1-fog)+14*fog;
  return [r,g,b];
}

function render3D(){
  const posX=camX, posY=camY, ang=camA;
  const dirX=Math.cos(ang), dirY=Math.sin(ang);
  const planeX=-dirY*Math.tan(Math.PI/5.5), planeY=dirX*Math.tan(Math.PI/5.5); // ~65 deg
  const horizon=(VH>>1) + Math.round(camBob*VH*0.4);
  // clear
  const black=PX(4,3,10,255);
  for(let i=0;i<pix.length;i++) pix[i]=black;
  for(let i=0;i<VW;i++) zbuf[i]=1e9;

  // ---- FLOOR & CEILING (half-res in x for speed, then doubled) ----
  for(let y=0;y<VH;y++){
    const p=y-horizon;
    if(p===0) continue;
    const isFloor=p>0;
    const rowDist=Math.abs((0.5*VH)/p);
    const stepX=rowDist*(2*planeX)/VW;
    const stepY=rowDist*(2*planeY)/VW;
    let fx=posX+rowDist*(dirX-planeX);
    let fy=posY+rowDist*(dirY-planeY);
    const fogD=rowDist;
    for(let x=0;x<VW;x++){
      const cx=Math.floor(fx), cy=Math.floor(fy);
      const tex=isFloor?floorTexFor(cx,cy):(TEXS.ceiling||TEXS.floor);
      const tw=tex?tex.w:TEX, th=tex?tex.h:TEX;
      const tx=((fx-cx)*tw)|0, ty=((fy-cy)*th)|0;
      let r,g,b;
      if(tex){ const s=sample(tex,tx,ty); r=s[0]; g=s[1]; b=s[2]; }
      else { r=40; g=36; b=48; }
      if(!isFloor){ r*=0.55; g*=0.55; b*=0.62; }
      const shd=shadeRGB(r,g,b, fogD, fx, fy, 0);
      pix[y*VW+x]=PX(shd[0],shd[1],shd[2],255);
      fx+=stepX; fy+=stepY;
    }
  }

  // ---- WALLS (DDA) ----
  for(let x=0;x<VW;x++){
    const cameraX=2*x/VW-1;
    const rayDirX=dirX+planeX*cameraX;
    const rayDirY=dirY+planeY*cameraX;
    let mapX=posX|0, mapY=posY|0;
    const deltaDistX=rayDirX===0?1e30:Math.abs(1/rayDirX);
    const deltaDistY=rayDirY===0?1e30:Math.abs(1/rayDirY);
    let stepX, stepY, sideDistX, sideDistY, side=0;
    if(rayDirX<0){ stepX=-1; sideDistX=(posX-mapX)*deltaDistX; }
    else { stepX=1; sideDistX=(mapX+1-posX)*deltaDistX; }
    if(rayDirY<0){ stepY=-1; sideDistY=(posY-mapY)*deltaDistY; }
    else { stepY=1; sideDistY=(mapY+1-posY)*deltaDistY; }
    let hit=0, out=0;
    for(let i=0;i<48&&!hit;i++){
      if(sideDistX<sideDistY){ sideDistX+=deltaDistX; mapX+=stepX; side=0; }
      else { sideDistY+=deltaDistY; mapY+=stepY; side=1; }
      if(!inB(mapX,mapY)){ hit=1; out=1; }
      else if(isWall(mapX,mapY)) hit=1;
    }
    let perp=side===0?(mapX-posX+(1-stepX)/2)/rayDirX:(mapY-posY+(1-stepY)/2)/rayDirY;
    if(!isFinite(perp)||perp<0.05) perp=0.05;
    zbuf[x]=perp;
    // mark explored
    if(inB(mapX,mapY)) explored[mapY][mapX]=true;
    if(inB(mapX-stepX, mapY-stepY) && side===0) explored[mapY][mapX-stepX] && (explored[mapY][mapX-stepX]=true);
    const lineH=(VH/perp)|0;
    let drawStart=((-lineH)/2+horizon)|0; if(drawStart<0) drawStart=0;
    let drawEnd=(lineH/2+horizon)|0; if(drawEnd>=VH) drawEnd=VH-1;
    let wallX=side===0?posY+perp*rayDirY:posX+perp*rayDirX;
    wallX-=Math.floor(wallX);
    let tex=out?TEXS.wall:wallTexFor(mapX,mapY);
    // door? if a wall sits at a 1-wide corridor mouth, still wall. Stairs are floors.
    if(!tex) tex=TEXS.wall;
    const tw=tex.w, th=tex.h;
    let texX=(wallX*tw)|0;
    if(side===0&&rayDirX>0) texX=tw-texX-1;
    if(side===1&&rayDirY<0) texX=tw-texX-1;
    const step=th/lineH;
    let texPos=(drawStart-horizon+lineH/2)*step;
    // torch glow if a torch is on this wall
    let torchBoost=0;
    for(const t of torches){ if(t.x===mapX&&t.y===mapY) torchBoost=0.35; }
    for(let y=drawStart;y<=drawEnd;y++){
      const texY=(texPos|0);
      texPos+=step;
      const s=sample(tex, texX, texY);
      let r=s[0], g=s[1], b=s[2];
      if(torchBoost){ r+=40*torchBoost; g+=22*torchBoost; b+=6*torchBoost; }
      const shd=shadeRGB(r,g,b, perp, mapX+0.5, mapY+0.5, side);
      pix[y*VW+x]=PX(shd[0],shd[1],shd[2],255);
    }
    // mark the floor cell we just walked the ray across as explored
    const fx=Math.floor(posX+dirX*Math.min(perp,4)), fy=Math.floor(posY+dirY*Math.min(perp,4));
    if(inB(fx,fy)) explored[fy][fx]=true;
  }

  // ---- SPRITES (billboards, depth sorted) ----
  const sprs=[];
  function addSpr(wx,wy,tex,scale,fly,flash,kind){
    if(!tex) return;
    sprs.push({wx,wy,tex,scale:scale||1,fly:!!fly,flash:flash||0,kind});
  }
  for(const m of monsters){
    if(!(m.alive||m.flash>0)) continue;
    // only if somewhat near and not behind tons of wall — still draw if in front, zbuf will clip
    const fr=sprFrame(m.spr||m.type, time*3+(m.bob||0));
    // flash white
    let tex=fr;
    if(m.flash>0 && (Math.floor(m.flash/50)%2===0) && fr){
      // use as-is; we'll tint at draw
    }
    addSpr(m.x+0.5, m.y+0.5, fr, m.scale||1, m.fly, m.flash, "mon");
  }
  for(const c of chests){
    addSpr(c.x+0.5,c.y+0.5, c.open?(SPRS.chest_open||SPRS.chest):SPRS.chest, 0.55, false, 0, "chest");
  }
  for(const it of items){
    let tex=SPRS.gold&&SPRS.gold[0];
    if(it.type==="potion") tex=SPRS.potion;
    else if(it.type==="gold") tex=Array.isArray(SPRS.gold)?SPRS.gold[(it.amount||0)>10?1:0]:SPRS.gold;
    else if(it.type==="weapon") tex=SPRS.sword;
    else if(it.type==="armor") tex=SPRS.armor;
    const bob=Math.sin(time*3+it.x)*0.04;
    addSpr(it.x+0.5, it.y+0.5, tex, 0.4, false, 0, "item");
    // bob applied as fly-ish offset later via scale; store
    if(sprs.length) sprs[sprs.length-1].vbob=bob;
  }
  for(let i=0;i<torches.length;i++){
    const t=torches[i];
    // torch sits on the wall, render on the floor just in front (lightX, lightY)
    const fr=sprFrame("torch", time*8+i);
    addSpr(t.lightX+0.5, t.lightY+0.35, fr, 0.55, false, 0, "torch");
  }
  for(const d of decorations){
    const tex=d.type==="bones"?SPRS.bones:d.type==="mushroom"?SPRS.mushroom:null;
    addSpr(d.x+0.5,d.y+0.5,tex,0.4,false,0,"dec");
  }
  if(stairs){
    if(stairsLocked) addSpr(stairs.x+0.5,stairs.y+0.5,SPRS.seal,0.5,false,0,"seal");
  }
  for(const p of projectiles){
    if(p.cx==null) continue;
    // small glowing orb as a 4x4 generated? use potion-ish — draw a solid in sprite path with a tiny tex
    addSpr(p.cx,p.cy, SPRS.seal, 0.25, true, 0, "bolt");
  }

  const invDet=1/(planeX*dirY-dirX*planeY);
  sprs.sort((a,b)=>{
    const da=(a.wx-posX)*(a.wx-posX)+(a.wy-posY)*(a.wy-posY);
    const db=(b.wx-posX)*(b.wx-posX)+(b.wy-posY)*(b.wy-posY);
    return db-da; // far first
  });
  for(const s of sprs){
    const sx=s.wx-posX, sy=s.wy-posY;
    const tx=invDet*(dirY*sx-dirX*sy);
    const ty=invDet*(-planeY*sx+planeX*sy);
    if(ty<=0.08) continue;
    const screenX=(VW/2)*(1+tx/ty);
    const spriteH=Math.abs(VH/ty)*s.scale;
    const aspect=s.tex.w/s.tex.h;
    const spriteW=spriteH*aspect;
    // feet on floor: floor at horizon + (VH/2)/ty
    const vOff=(s.vbob||0)*VH + (s.fly?-spriteH*0.25:0);
    const drawEnd=horizon+(VH/2)/ty + vOff;
    const drawStart=drawEnd-spriteH;
    const dsx=Math.floor(screenX-spriteW/2);
    const dex=Math.floor(screenX+spriteW/2);
    const dsy=Math.max(0,drawStart|0);
    const dey=Math.min(VH-1,drawEnd|0);
    const tw=s.tex.w, th=s.tex.h;
    const flash=s.flash>0 && ((s.flash/50)|0)%2===0;
    for(let stripe=dsx; stripe<dex; stripe++){
      if(stripe<0||stripe>=VW) continue;
      if(ty>=zbuf[stripe]) continue;
      const texX=((stripe-dsx)*tw/spriteW)|0;
      for(let y=dsy;y<=dey;y++){
        const texY=((y-drawStart)*th/spriteH)|0;
        const sm=sample(s.tex, texX, texY);
        if(sm[3]<16) continue;
        let r=sm[0], g=sm[1], b=sm[2];
        if(flash){ r=255; g=255; b=255; }
        const shd=shadeRGB(r,g,b, ty, s.wx, s.wy, 0);
        // keep some alpha blending for edges
        if(sm[3]<240){
          const dest=pix[y*VW+stripe];
          // decode LE
          let dr=dest&255, dg=(dest>>8)&255, db=(dest>>16)&255;
          const a=sm[3]/255;
          r=dr+(shd[0]-dr)*a; g=dg+(shd[1]-dg)*a; b=db+(shd[2]-db)*a;
          pix[y*VW+stripe]=PX(r,g,b,255);
        } else {
          pix[y*VW+stripe]=PX(shd[0],shd[1],shd[2],255);
        }
      }
    }
  }

  buf.putImageData(imgData,0,0);
}

function project(wx,wy){
  const dirX=Math.cos(camA), dirY=Math.sin(camA);
  const planeX=-dirY*Math.tan(Math.PI/5.5), planeY=dirX*Math.tan(Math.PI/5.5);
  const invDet=1/(planeX*dirY-dirX*planeY);
  const sx=wx-camX, sy=wy-camY;
  const tx=invDet*(dirY*sx-dirX*sy);
  const ty=invDet*(-planeY*sx+planeX*sy);
  if(ty<=0.08) return null;
  return {x:(VW/2)*(1+tx/ty), y:(VH/2)+(VH/2)/ty, z:ty};
}

/* ---------- weapon overlay (drawn in screen space on the 3D buffer) ---------- */
function drawWeaponOnBuf(){
  const kind=player?player.weapon:"rusty";
  let tex=weaponAnim.active?(SPRS.weapons_swing[kind]||SPRS.weapon_swing):(SPRS.weapons[kind]||SPRS.weapon);
  if(!tex||!tex.canvas) return;
  const g=buf;
  g.imageSmoothingEnabled=false;
  const swing=weaponAnim.active?clamp(weaponAnim.t/weaponAnim.dur,0,1):0;
  // wind-up then slash then recover
  let ox=0, oy=0, rot=0;
  if(swing>0){
    if(swing<0.3){ const u=swing/0.3; ox=20*u; oy=10*u; }
    else if(swing<0.55){ const u=(swing-0.3)/0.25; ox=20-80*u; oy=10-30*u; }
    else { const u=(swing-0.55)/0.45; ox=-60*(1-u); oy=-20*(1-u); }
  }
  const bob=Math.sin(time*2.2)*3 + (anim&&anim.type==="move"?Math.sin((anim.t/anim.dur)*Math.PI)*8:0);
  const aspect=(tex.w&&tex.h)?tex.w/tex.h:1.25;
  const dh=Math.floor(VH*0.66), dw=Math.floor(dh*aspect);
  const dx=VW-dw+6+ox, dy=VH-dh+10+oy+bob;
  g.drawImage(tex.canvas, dx, dy, dw, dh);
}

/* ---------- HUD, SMALL corner automap, screens ---------- */
function panel(g,x,y,w,h,fill){
  g.fillStyle=fill||"rgba(10,8,20,0.82)";
  g.fillRect(x,y,w,h);
  g.fillStyle="#c8a050";
  g.fillRect(x,y,w,1); g.fillRect(x,y+h-1,w,1);
  g.fillRect(x,y,1,h); g.fillRect(x+w-1,y,1,h);
  g.fillStyle="#edd078";
  const s=Math.max(2,uiScale());
  g.fillRect(x,y,s,s); g.fillRect(x+w-s,y,s,s);
  g.fillRect(x,y+h-s,s,s); g.fillRect(x+w-s,y+h-s,s,s);
}

function drawMinimap(g, mx, my, mw, mh){
  // Small corner automap — fog of war, never full-screen, sits in a corner of the 3D view.
  const cell=Math.max(2, Math.floor(Math.min(mw/MAP_W, mh/MAP_H)));
  const rw=MAP_W*cell, rh=MAP_H*cell;
  const ox=mx+mw-rw, oy=my; // right-align inside the reserved box
  g.fillStyle="rgba(0,0,0,0.55)";
  g.fillRect(ox-2,oy-2,rw+4,rh+4);
  g.strokeStyle="rgba(200,160,80,0.45)";
  g.strokeRect(ox-2.5,oy-2.5,rw+5,rh+5);
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
    if(!explored[y]||!explored[y][x]) continue;
    let c="#2a2838";
    const t=tiles[y][x];
    if(t===T_WALL||t===T_PILLAR) c="#c0b8c8";
    else if(t===T_STAIRS) c="#c0a0ff";
    else if(t===T_RUG||t===T_BOSS) c="#6a3050";
    else c="#8a8498";
    g.fillStyle=c;
    g.fillRect(ox+x*cell, oy+y*cell, cell, cell);
  }
  // visible monsters (on explored + in front-ish)
  for(const m of monsters){
    if(m.alive&&explored[m.y]&&explored[m.y][m.x]&&dist(m.x,m.y,player.x,player.y)<10){
      g.fillStyle=m.isBoss?"#ff4060":"#e06060";
      g.fillRect(ox+m.x*cell, oy+m.y*cell, cell, cell);
    }
  }
  if(player){
    const px=ox+player.x*cell+cell/2, py=oy+player.y*cell+cell/2;
    g.fillStyle="#60c0ff";
    g.beginPath();
    const a=player.facing*Math.PI/2;
    const r=Math.max(2.5, cell*1.1);
    g.moveTo(px+Math.cos(a)*r, py+Math.sin(a)*r);
    g.lineTo(px+Math.cos(a+2.4)*r*0.7, py+Math.sin(a+2.4)*r*0.7);
    g.lineTo(px+Math.cos(a-2.4)*r*0.7, py+Math.sin(a-2.4)*r*0.7);
    g.closePath(); g.fill();
  }
  return {ox,oy,rw,rh};
}

function drawHUD(g){
  const s=uiScale();
  const pad=4*s;
  const topH=22*s+pad*2;
  const mutePad=Math.round(56*(DPR||1));
  panel(g,0,0,canvas.width,topH,"rgba(8,6,16,0.88)");
  g.save();
  g.beginPath(); g.rect(0,0,canvas.width-mutePad,topH); g.clip();
  const hx=pad, hy=pad+2*s;
  drawText(g,"HP",hx,hy+1,"#e07070",s,"left");
  const barX=pad+textWidth("HP ",s), barY=hy+s, barW=Math.min(90*s, canvas.width*0.28), barH=8*s;
  g.fillStyle="#2a1018"; g.fillRect(barX,barY,barW,barH);
  const ratio=player?clamp(player.hp/player.maxHp,0,1):0;
  g.fillStyle=ratio<0.25?"#e03030":ratio<0.5?"#e09030":"#40c060";
  g.fillRect(barX+s,barY+s,Math.max(0,(barW-2*s)*ratio),barH-2*s);
  g.fillStyle="rgba(255,255,255,0.2)"; g.fillRect(barX+s,barY+s,Math.max(0,(barW-2*s)*ratio),s);
  drawText(g,(player?player.hp:0)+"/"+(player?player.maxHp:0), barX+barW+3*s, hy+1, "#f0e8d0", s, "left");
  let ix=barX+barW+textWidth(" 00/00  ",s)+6*s;
  function stat(label,val,col){
    drawText(g,label,ix,hy+1,"#9088a0",s); ix+=textWidth(label+" ",s);
    drawText(g,String(val),ix,hy+1,col||"#f0e8d0",s); ix+=textWidth(String(val)+"  ",s);
  }
  stat("FLR",floorNum,"#d0c0ff");
  stat("LV",player?player.level:1,"#ffe080");
  if(player){
    const need=xpNeeded(player.level), xr=clamp(player.xp/need,0,1);
    const xw=28*s, xh=5*s;
    g.fillStyle="#1a1824"; g.fillRect(ix,hy+1+2*s,xw,xh);
    g.fillStyle="#d0b040"; g.fillRect(ix,hy+1+2*s,xw*xr,xh);
    ix+=xw+6*s;
  }
  stat("GOLD",player?player.gold:0,"#ffe080");
  const ly=hy+12*s;
  const wname=player?((WEAPONS[player.weapon]||{}).name||"Sword"):"";
  const aname=player?((ARMORS[player.armor]||{}).name||""):"";
  drawText(g, "ATK "+(player?playerAtk():0)+"  DEF "+(player?playerDef():0)+"   POT "+(player?player.potions:0)+"   "+wname+"  "+aname, pad, ly, "#c8c0a8", s);
  g.restore();

  // 3D viewport already drawn; HUD overlays
  // Boss bar
  if(currentBoss&&currentBoss.alive&&currentBoss.seen){
    const bw=Math.min(canvas.width-20*s, 200*s);
    const bx=(canvas.width-bw)/2, by=topH+4*s, bh=10*s;
    panel(g,bx-4*s,by-6*s,bw+8*s,bh+16*s,"rgba(20,8,16,0.9)");
    drawText(g, currentBoss.name+"  "+currentBoss.title, canvas.width/2, by-4*s, currentBoss.color||"#ffd070", s, "center");
    g.fillStyle="#2a1010"; g.fillRect(bx,by+6*s,bw,bh);
    const br=clamp(currentBoss.hp/currentBoss.maxHp,0,1);
    g.fillStyle="#c02840"; g.fillRect(bx+s,by+6*s+s,(bw-2*s)*br,bh-2*s);
    drawText(g, currentBoss.hp+" / "+currentBoss.maxHp, canvas.width/2, by+6*s+1, "#ffe0e0", s, "center", true);
  }

  // Monster ahead nameplate
  if(mode==="play"&&player){
    const a=ahead();
    const m=monAt(a.x,a.y);
    if(m&&m.alive){
      const label=m.isBoss?(m.name+", "+m.title):m.name;
      const tw=textWidth(label+"  ",s)+8*s;
      const tx=(canvas.width-tw)/2, ty=viewY+viewH-28*s;
      panel(g,tx,ty,tw,12*s,"rgba(10,6,14,0.75)");
      drawText(g,label,canvas.width/2,ty+2*s,m.isBoss?(m.color||"#ffd070"):"#f0e0c8",s,"center");
    }
  }

  // Messages at the bottom of the CANVAS (above touch controls — canvas itself sits above them)
  const visM=msgs.slice(-3);
  const logH=visM.length*(8*s)+pad;
  const logY=canvas.height-logH-2*s;
  if(visM.length){
    g.fillStyle="rgba(8,6,16,0.7)";
    g.fillRect(0,logY-2*s,canvas.width,logH+4*s);
  }
  visM.forEach((m,i)=>{
    const a=m.t>4000?Math.max(0,1-(m.t-4000)/2000):1;
    g.globalAlpha=a;
    drawText(g,m.text,pad,logY+i*8*s,m.color,s,"left");
    g.globalAlpha=1;
  });
}

function drawBanner(g,dt){
  if(!banner) return;
  banner.t+=dt;
  if(banner.t>banner.life){ banner=null; return; }
  const a=banner.t<200?banner.t/200:(banner.t>banner.life-300?(banner.life-banner.t)/300:1);
  const s=Math.max(2,uiScale()+1);
  const y=Math.floor(canvas.height*0.28);
  g.globalAlpha=a*0.85;
  g.fillStyle="#000"; g.fillRect(0,y-16*s,canvas.width,32*s);
  g.globalAlpha=a;
  g.fillStyle=banner.color||"#ffe080";
  g.fillRect(0,y-16*s,canvas.width,2); g.fillRect(0,y+16*s-2,canvas.width,2);
  drawText(g,banner.text,canvas.width/2,y-10*s,banner.color||"#ffe080",s,"center");
  if(banner.sub) drawText(g,banner.sub,canvas.width/2,y+2*s,"#d8d0c0",Math.max(1,s-1),"center");
  g.globalAlpha=1;
}

let titleMap=null;
function setupTitleMap(){
  const w=16,h=14;
  titleMap=Array.from({length:h},()=>Array(w).fill(T_WALL));
  for(let y=3;y<h-2;y++) for(let x=3;x<w-3;x++) titleMap[y][x]=T_FLOOR;
  for(let y=5;y<9;y++) for(let x=5;x<11;x++) titleMap[y][x]=T_RUG;
  titleMap[4][7]=T_STAIRS;
  titleMap[6][4]=T_PILLAR; titleMap[6][11]=T_PILLAR;
  titleMap[10][4]=T_PILLAR; titleMap[10][11]=T_PILLAR;
}
function renderTitleView(){
  // temporarily swap world to title hall
  const saved={tiles,torches,chests,items,monsters,decorations,stairs,explored,lightMap,torchLight,camX,camY,camA};
  tiles=titleMap;
  const oldW=MAP_W, oldH=MAP_H;
  // we can't easily change MAP_W - title map is 16x14, inB uses MAP_W. We'll place the hall at 0,0 and walls fill the rest... 
  // Simpler: generate into a local copy using existing tiles of a tiny carved area? 
  // Use the live tiles of a static scene built once into real maps at boot if missing.
  torches=[
    {x:5,y:3,lightX:5,lightY:4},{x:10,y:3,lightX:10,lightY:4},
    {x:5,y:11,lightX:5,lightY:11},{x:10,y:11,lightX:10,lightY:11}
  ];
  chests=[]; items=[]; monsters=[]; decorations=[]; stairs={x:7,y:4};
  // explored all of hall
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++) explored[y][x]=false;
  for(let y=0;y<14;y++) for(let x=0;x<16;x++) if(y<MAP_H&&x<MAP_W) explored[y][x]=true;
  camX=8.0; camY=11.2; camA=-Math.PI/2 + Math.sin(time*0.25)*0.06; camBob=Math.sin(time*1.5)*0.01;

  // restore

  monsters=saved.monsters; decorations=saved.decorations; stairs=saved.stairs;
  explored=saved.explored; lightMap=saved.lightMap; torchLight=saved.torchLight;

function resize(){
  const vv=window.visualViewport;
  const ww=Math.floor(vv?vv.width:window.innerWidth);
  const wh=Math.floor(vv?vv.height:window.innerHeight);
  SHOW_TOUCH=("ontouchstart" in window)||(navigator.maxTouchPoints>0)||window.matchMedia("(pointer:coarse)").matches;
  if(ww<800) SHOW_TOUCH=true;
  if(ww>=900 && window.matchMedia("(pointer:fine)").matches && !("ontouchstart" in window)) SHOW_TOUCH=false;
  const ui=document.getElementById("touch-ui");
  const touchActive=SHOW_TOUCH&&(mode==="play"||mode==="pause"||mode==="dead");
  if(touchActive) ui.classList.remove("hidden"); else ui.classList.add("hidden");
  // Measure the real pad so the 3D view never covers (or is covered by) the controls.
  let safeB=0;
  if(touchActive){
    const r=ui.getBoundingClientRect();
    safeB=Math.max(120, Math.ceil(r.height+2));
  }
  const wrap=document.getElementById("wrap");
  if(touchActive){ wrap.style.alignItems="flex-start"; wrap.style.justifyContent="center"; wrap.style.paddingTop="0px"; }
  else { wrap.style.alignItems="center"; wrap.style.justifyContent="center"; }
  DPR=Math.min(window.devicePixelRatio||1, 3);
  const availW=ww, availH=Math.max(200, wh-safeB);
  const margin=(!SHOW_TOUCH && ww>900)?20:0;
  CSSW=Math.max(160, availW-margin*2);
  CSSH=Math.max(160, availH-(margin?8:0));
  canvas.style.width=CSSW+"px";
  canvas.style.height=CSSH+"px";
  canvas.width=Math.max(2, Math.floor(CSSW*DPR));
  canvas.height=Math.max(2, Math.floor(CSSH*DPR));
  const s=uiScale();
  const topH=22*s+8*s;
  const botH=20*s;
  viewX=0;
  viewY=topH;
  viewW=canvas.width;
  viewH=Math.max(48, canvas.height-topH-botH);
  ctx.imageSmoothingEnabled=false;
}

function render(dt){
  ctx.imageSmoothingEnabled=false;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="#07060c";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(mode==="title"){
    drawTitle(ctx);
    return;
  }

  // shake
  let shx=0, shy=0;
  if(shakeT>0){
    shakeT-=dt;
    const m=shakeMag*(shakeT/220);
    shx=(Math.random()*2-1)*m*0.8;
    shy=(Math.random()*2-1)*m*0.8;
    if(shakeT<=0) shakeMag=0;
  }

  if(tiles) computeLight(time);
  if(tiles) render3D();
  if(player) drawWeaponOnBuf();
  ctx.save();
  ctx.translate(shx, shy);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(bufCan, viewX, viewY, viewW, viewH);

  // stone frame around 3D view
  ctx.strokeStyle="#c8a050";
  ctx.lineWidth=Math.max(2, uiScale()/2);
  ctx.strokeRect(viewX+1, viewY+1, viewW-2, viewH-2);

  // SMALL corner automap: top-RIGHT of the 3D view, just under the HUD,
  // compact so it never covers the centre of the view or the iPhone touch pad
  // (touch pad is outside/below the canvas).
  if(player && (mode==="play"||mode==="pause"||mode==="dead")){
    const s=uiScale();
    const bossPad=(currentBoss&&currentBoss.alive&&currentBoss.seen)?22*s:0;
    // Target ~22–28% of the 3D viewport width, capped, and only the top-right corner.
    const box=Math.floor(Math.min(viewW*0.26, viewH*0.34, 28*(DPR||1)*MAP_W/12));
    const mapW=Math.max(48, box);
    const mapH=Math.floor(mapW*(MAP_H/MAP_W));
    const mx=viewX+viewW-mapW-6*s;
    const my=viewY+6*s+bossPad;
    drawMinimap(ctx, mx, my, mapW, mapH);
  }

  // floats in world, projected into the 3D view
  const flLeft=[];
  for(const f of floats){
    f.t+=dt;
    if(f.t>f.life) continue;
    const pr=project(f.wx, f.wy);
    if(pr){
      const a=1-f.t/f.life;
      const sx=viewX+(pr.x/VW)*viewW;
      const sy=viewY+(pr.y/VH)*viewH - (f.t/f.life)*28*(DPR||1);
      ctx.globalAlpha=a;
      drawText(ctx, f.text, sx, sy, f.color, Math.max(2,uiScale()), "center", true);
      ctx.globalAlpha=1;
    }
    flLeft.push(f);
  }
  floats=flLeft;

  ctx.restore();

  if(redFlash>0){
    ctx.fillStyle=`rgba(160,0,0,${redFlash*0.28})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    redFlash=Math.max(0, redFlash-dt/400);
  }
  if(fadeIn>0){
    ctx.fillStyle=`rgba(0,0,0,${fadeIn})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    fadeIn=Math.max(0, fadeIn-dt/500);
  }

  drawHUD(ctx);
  drawBanner(ctx,dt);
  if(mode==="pause") drawPause(ctx);
  if(mode==="dead") drawDead(ctx);
}

/* ---------- game flow ---------- */
function startGame(){
  SFX.unlock(); SFX.ui();
  floorNum=1;
  makePlayer();
  generateFloor(1);
  player.x=startPos.x; player.y=startPos.y;
  player.facing=pickStartFacing();
  snapCam();
  markExploredAround();
  // explore a cone ahead
  const d=DIR[player.facing];
  for(let k=1;k<8;k++){
    const x=player.x+d.x*k, y=player.y+d.y*k;
    if(!inB(x,y)) break;
    explored[y][x]=true;
    if(isWall(x,y)) break;
    for(const [ox,oy] of [[d.y, -d.x],[-d.y, d.x]]){
      if(inB(x+ox,y+oy)) explored[y+oy][x+ox]=true;
    }
  }
  msgs=[]; particles=[]; floats=[]; projectiles=[];
  banner={text:"FLOOR 1",sub:"The first stone steps groan.",t:0,color:"#e0d8c0",life:1600};
  msg("Welcome to the Ashen Depths.","#e0d8c0");
  msg("Advance with W, turn with A and D, strike with Space.","#c0b8a0");
  mode="play";
  animating=false; queued=null; fadeIn=1; anim=null;
  resize();
}
function togglePause(){
  if(mode==="play"){ mode="pause"; SFX.ui(); }
  else if(mode==="pause"){ mode="play"; SFX.ui(); }
}

/* ---------- input ---------- */
function onConfirm(){
  SFX.unlock();
  if(mode==="title"||mode==="dead") startGame();
  else if(mode==="pause") togglePause();
}
window.addEventListener("keydown", ev=>{
  SFX.unlock();
  const k=ev.key;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","w","a","s","d","W","A","S","D","q","Q","e","E"].includes(k)) ev.preventDefault();
  if(ev.repeat && (k==="Enter"||k==="p"||k==="P"||k==="m"||k==="M")) return;
  if(mode==="title"||mode==="dead"){
    if(k==="Enter"||k===" ") onConfirm();
    return;
  }
  if(k==="p"||k==="P"||k==="Escape"){ togglePause(); return; }
  if(k==="m"||k==="M"){ toggleMute(); return; }
  if(mode==="pause"){ if(k==="Enter") togglePause(); return; }
  if(k==="ArrowUp"||k==="w"||k==="W") tryForward();
  else if(k==="ArrowDown"||k==="s"||k==="S") tryBack();
  else if(k==="ArrowLeft"||k==="a"||k==="A") tryTurn(-1);
  else if(k==="ArrowRight"||k==="d"||k==="D") tryTurn(1);
  else if(k==="q"||k==="Q") tryStrafe(-1);
  else if(k==="e"||k==="E") tryStrafe(1);
  else if(k===" ") { ev.preventDefault(); tryAttack(); }
  else if(k==="f"||k==="F") usePotion();
  else if(k==="."||k==="x"||k==="X") waitTurn();
  else if(k==="Enter"){ /* no-op in play */ }
});

function bindHold(el, fn){
  let t=null, first=null;
  const start=e=>{ e.preventDefault(); SFX.unlock(); el.classList.add("pressed"); fn(); clearTimeout(first); clearInterval(t); first=setTimeout(()=>{ t=setInterval(fn, 150); }, 320); };
  const end=e=>{ e.preventDefault(); el.classList.remove("pressed"); clearTimeout(first); clearInterval(t); };
  el.addEventListener("pointerdown", start);
  el.addEventListener("pointerup", end);
  el.addEventListener("pointerleave", end);
  el.addEventListener("pointercancel", end);
}
